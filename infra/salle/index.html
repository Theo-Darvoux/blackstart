function vueParc() {
  const ph = E.phase, b = E.bascule || {};
  const coupe = ph === "bascule" && b.coupure_debut && !b.retabli, promue = !!b.retabli && ph !== "remise";
  const ciActive = (ph === "ci1" && E.ci1 && !E.ci1.fin) || ph === "ci2";
  const pasM = (opEnCours()?.pas || []).filter((p) => p.etat === "en_cours").map((p) => p.machine).join(" ");
  const actif = (ip) => !!ip && pasM.includes(ip);
  const pf = P?.plateforme || {}, fo = pf.forge || {}, mo = pf.modele || {};
  // État réel vu par la plateforme (port SSH, API de la forge, modèles chargés), puis ce que la démo en cours y fait.
  const sonde = (ip) => {
    const h = J?.hotes?.[ip];
    if (!J) return ["avenir", "Vérification…", ""];
    if (!h) return ["avenir", "Non vérifiée", ""];
    if (h.ok === null) return ["avenir", "Hors périmètre", ""];
    return h.ok ? ["ok", "En ligne", `répond en ${h.ms} ms`] : ["ko", "Injoignable", h.erreur === "refusé" ? "port SSH fermé" : "ne répond pas"];
  };
  const ligne = (nom, role, ip, [etat, lib, detail], vers = "", note = "") => `<tr ${vers ? `data-vers="${esc(vers)}"` : ""}>
      <td><div class="nom">${esc(nom)}</div><div class="role">${esc(role)}</div></td>
      <td class="mono doux">${esc(ip)}</td>
      <td>${etiquetteEtat(etat, lib)}${detail ? `<div class="petit">${esc(detail)}</div>` : ""}</td>
      <td class="doux" style="font-size:13px">${note}</td></tr>`;
  const prod = (P?.machines || []).map((x) => {
    let st = sonde(x.ip);
    if (x.vm === VM_LIVE) {
      if (promue) st = ["ok", "En production", "copie reconstruite (VM 1650)"];
      else if (coupe) st = ["avenir", "Éteinte", "original gardé pour le retour arrière"];
      else if (actif(x.ip)) st = ["en_cours", "Audit en cours", "lecture seule"];
    }
    const acces = x.acces ? (x.acces.etat === "ok" ? `accès vérifié le ${jourFr(x.acces.date)}` : "accès en échec") : x.rapport ? "accès installé" : "accès à installer";
    return ligne(x.vm, x.role, x.ip, st, x.vm === VM_LIVE ? "ensemble" : "m-" + x.vm, esc(acces));
  }).join("");
  let stF = sonde(fo.ip), stM = sonde(mo.ip), stS = sonde(SBX_IP_DEMO);
  if (J && stF[0] === "ok") stF = J.forge.ok ? ["ok", "En ligne", J.forge.version ? `Forgejo ${J.forge.version} répond` : "l'API de Forgejo répond"] : ["attention", "Forge muette", "SSH répond, pas l'API"];
  if (J && stM[0] === "ok") stM = J.modele.ok ? (J.modele.charges.includes(mo.modele) ? ["ok", "Modèle chargé", `${mo.modele} en mémoire`] : ["attention", "En ligne", "modèle pas en mémoire : 3 à 5 min au 1er appel"]) : ["attention", "API muette", "SSH répond, pas Ollama"];
  if (ciActive || actif(fo.ip)) stF = ["en_cours", "Vérifie la MR", ""];
  if (ph === "ia" || actif(mo.ip)) stM = ["en_cours", "Lit les preuves", "secrets masqués"];
  if (stS[0] === "ko") stS = ["avenir", "Éteinte", "créée à la demande par la CI"];
  if (ph === "ci2") stS = ["en_cours", "Reconstruction", "isolée"];
  if (promue) stS = ["ok", "Promue", "→ 192.168.103.200"];
  const tableau = (lignes) => `<table class="parc"><thead><tr><th>Machine</th><th>Adresse</th><th>État</th><th></th></tr></thead><tbody>${lignes}</tbody></table>`;
  const versChemin = (l) => (l || []).map((d) => ({ path: d.fichier, line: d.ligne, ip: d.ip }));
  const deps = (P?.machines || []).flatMap((m) => (m.vm === VM_LIVE ? versChemin(E.audit?.ip_en_dur) : m.rapport ? m.ip_en_dur || [] : versChemin(m.integration?.ip_en_dur)).map((d) => ({ ...d, vm: m.vm })));
  return `<div class="entete avec-actions"><div><h1>Infrastructure</h1><p>Les machines que la plateforme connaît et leur état réel, vérifié toutes les 20 s sans s'y connecter (le port SSH répond-il ?).</p></div>
      <div style="display:flex;gap:10px">${bouton({ vers: "ajout", lib: "Ajouter une machine", ok: true }, false).replace('class="bouton ', 'class="bouton second ')}</div></div>
    <div class="bloc"><div class="tete"><h2>Production</h2><span class="droite doux">les serveurs de l'entreprise, déclarés dans le parc</span></div>${tableau(prod || `<tr><td colspan="4" class="vide">Aucune machine déclarée.</td></tr>`)}</div>
    <div class="bloc"><div class="tete"><h2>Plateforme Black Start, sur site</h2><span class="droite doux">installée chez l'entreprise, rien ne sort du site</span></div>${tableau(
      ligne(fo.nom || "forge", fo.role || "", fo.ip || "", stF, "", fo.url ? `<a href="${esc(fo.url)}" target="_blank" rel="noopener">ouvrir ↗</a>` : "")
      + ligne(mo.nom || "modèle", mo.role || "", mo.ip || "", stM)
      + ligne("sbx-logistique", "Copie isolée de bs-logistique, pour la preuve et la bascule", SBX_IP_DEMO, stS, "", pf.sandbox ? `plage ${esc(pf.sandbox.ip)}` : ""))}</div>
    ${deps.length ? `<section class="bloc"><div class="tete"><h2>Dépendances entre machines</h2><span class="droite doux">adresses IP écrites en dur : à modifier si une machine change d'adresse</span></div>
      <table><thead><tr><th>Machine</th><th>Fichier</th><th>Vers</th></tr></thead><tbody>${deps.map((d) =>
        `<tr><td class="mono">${esc(d.vm)}</td><td class="cle">${esc(d.path)}${d.line ? `<span class="pale"> : ${d.line}</span>` : ""}</td><td><span class="mono">${esc(d.ip)}</span> <span class="doux">${esc(nomIP(d.ip))}</span></td></tr>`).join("")}</tbody></table></section>` : ""}
    <div class="source">${J ? `État vérifié à ${heure(J.date)}` : "Vérification de l'état…"}<button class="lien" data-joignabilite>Actualiser</button></div>`;
}

// Audit montré par la vue : la reprise en direct de bs-logistique, ou le premier audit d'une machine intégrée.
const vmCourante = () => vueMachineDe(vue)?.[0] || VM_LIVE;
const auditCourant = () => vmCourante() === VM_LIVE ? E.audit : machineP(vmCourante())?.integration;

function lignesInventaire() {
  const a = auditCourant(), q = recherche.trim().toLowerCase(), live = vmCourante() === VM_LIVE;
  const props = live ? E.ia?.propositions || {} : {}, prises = live ? E.decisions?.prises || {} : {};
  const els = a.elements.filter((x) => (filtre === "tous" || x.statut === filtre) && (!q || x.cle.toLowerCase().includes(q) || (x.raison || "").toLowerCase().includes(q)))
    .sort((x, y) => ORDRE.indexOf(x.statut) - ORDRE.indexOf(y.statut));
  if (!els.length) return `<tr><td colspan="4" class="vide">Aucun élément.</td></tr>`;
  return els.map((x) => {
    const [cat, ...reste] = x.cle.split(":"), ouvert = ouverts.has(x.cle);
    const det = ouvert ? `<tr class="detail"><td colspan="4"><div style="display:grid;gap:8px">
        <div><span class="doux">Clé complète :</span> <span class="mono">${esc(x.cle)}</span></div>
        <div><span class="doux">Écart :</span> ${esc(ECARTS[x.ecart] || x.ecart)} par rapport à ${live ? "une Debian 13 neuve" : "l'image de référence"} · <span class="doux">Classement :</span> ${esc(x.raison)}</div>
        ${proposition(props[x.cle])}
        ${prises[x.cle] ? `<div><span class="doux">Décision de ${esc(E.par)} :</span> <b>${esc(LIB_DECISION[prises[x.cle].decision] || prises[x.cle].decision)}</b> · ${esc(prises[x.cle].raison)}</div>` : x.statut === "inconnu" ? `<div class="doux">En attente d'une décision humaine.</div>` : ""}
      </div></td></tr>` : "";
    return `<tr class="el" data-el="${esc(x.cle)}"><td>${statut(x.statut)}</td><td class="cle">${esc(reste.join(":"))}</td><td>${esc(CATEGORIES[cat] || cat)}</td><td class="doux">${esc(x.raison)}</td></tr>${det}`;
  }).join("");
}

function vueInventaire() {
  const a = E.audit;
  if (!a) return teteMachine(VM_LIVE) + `<div class="vide">Pas encore d'audit : le lancer depuis le Résumé.</div>`;
  return teteMachine(VM_LIVE) + `<p class="intro">${a.total} écarts avec une Debian 13 neuve, relevés le ${new Date(a.date).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" })} (${esc(a.machine?.resume || "")}). Chaque écart porte la règle qui l'a classé.</p>
    <div>${repartition(a)}</div>
    <div class="bloc">
      <div class="tete"><div class="filtres">${[["tous", "Tous", a.total], ...ORDRE.map((s) => [s, STATUTS[s][0], a.comptes[s] || 0])].map(([k, lib, n]) =>
        `<button class="filtre ${filtre === k ? "on" : ""}" data-filtre="${k}">${k !== "tous" ? `<i class="pt c-${k}"></i>` : ""}${lib} <b>${n}</b></button>`).join("")}</div>
        <input type="search" placeholder="Chercher un fichier, un paquet…" id="recherche" value="${esc(recherche)}">
        <button class="bouton second" data-export title="Tous les écarts, avec leur statut et la règle qui les classe">Exporter (CSV)</button></div>
      <table><thead><tr><th style="width:120px">Statut</th><th>Élément</th><th style="width:190px">Type</th><th>Pourquoi</th></tr></thead><tbody id="lignes">${lignesInventaire()}</tbody></table>
    </div>`;
}

// Export de l'audit : un écart par ligne, statut, type, écart, règle ; décision humaine si elle existe.
function exporterCSV() {
  const a = auditCourant(); if (!a) return;
  const live = vmCourante() === VM_LIVE, prises = live ? E.decisions?.prises || {} : {}, props = live ? E.ia?.propositions || {} : {};
  const q = (x) => `"${String(x ?? "").replace(/"/g, '""')}"`;
  const lignes = [["element", "statut", "type", "ecart", "regle", "proposition_modele", "decision", "raison_decision"].join(";")]
    .concat(a.elements.map((x) => [x.cle, STATUTS[x.statut]?.[0] || x.statut, CATEGORIES[x.cle.split(":")[0]] || x.cle.split(":")[0], ECARTS[x.ecart] || x.ecart, x.raison,
      props[x.cle] ? LIB_PROPO[props[x.cle].statut] || props[x.cle].statut : "", prises[x.cle] ? LIB_DECISION[prises[x.cle].decision] || prises[x.cle].decision : "", prises[x.cle]?.raison || ""].map(q).join(";")));
  const url = URL.createObjectURL(new Blob(["﻿" + lignes.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  const l = document.createElement("a"); l.href = url; l.download = `audit-${vmCourante()}-${(typeof a.date === "number" ? new Date(a.date * 1000).toISOString() : a.date || "").slice(0, 10)}.csv`; l.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function vueDecisions() {
  const cartes = E.decisions?.cartes || [], prises = E.decisions?.prises;
  const entete = teteMachine(VM_LIVE) + `<p class="intro">Ce que personne n'a documenté. Le modèle local propose à partir des preuves, secrets masqués ; ${esc(E.par)} décide et signe.</p>`;
  if (!cartes.length) return entete + `<div class="bloc"><div class="vide">${E.audit ? "Aucune décision en attente." : "Les inconnus apparaîtront ici après l'audit."}</div></div>`;
  if (prises) {
    return entete + `<div class="bloc"><div class="tete"><h2>${cartes.length} décisions signées ${esc(E.par)}</h2><span class="droite doux" style="font-size:14px">${E.decisions.date ? `à ${heure(E.decisions.date)} · ` : ""}versionnées dans la merge request</span></div>
      <table><thead><tr><th>Élément</th><th style="width:170px">Décision</th><th>Raison</th></tr></thead><tbody>${cartes.map((c) => {
        const d = prises[c.cle] || {};
        return `<tr><td class="cle">${esc(c.cle)}</td><td><b>${esc(LIB_DECISION[d.decision] || d.decision || "")}</b></td><td class="doux">${esc(d.raison || "")}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  }
  const faites = cartes.filter((c) => choix[c.cle]?.decision && choix[c.cle]?.raison?.trim()).length;
  const conflits = conflitsDecisions(cartes), nbConflits = Object.keys(conflits).length;
  const html = cartes.map((c, i) => {
    const ch = choix[c.cle] || {}, data = c.cle.startsWith("data:");
    const opts = data ? [["accepter", "Accepter la perte", "accepter"]] : [["reproduire", "Garder", "reproduire"], ["ne pas reproduire", "Retirer", "non"]];
    const bloque = (v) => v === "reproduire" && c.garder_impossible;
    const liees = c.liees || [], pb = conflits[c.cle] || [];
    const signale = pb.length || (E.erreur_cles || []).includes(c.cle);
    return `<div class="bloc dec ${ch.decision && ch.raison?.trim() && !pb.length ? "prise" : ""} ${signale ? "en-erreur" : ""}" data-cle="${esc(c.cle)}">
      <div class="info"><div class="haut-dec"><span class="cle">${esc(c.cle)}</span><span class="n">${i + 1} / ${cartes.length}</span></div>
        <div class="constat">Constat de l'audit : ${esc(c.constat)}</div>
        ${liees.length ? `<div class="lie">Va avec <span class="mono">${liees.map(esc).join(", ")}</span> (même programme) : la décision s'applique aux deux.</div>` : ""}
        ${proposition(c.proposition)}</div>
      <div class="geste"><div class="choix">${opts.map(([v, lib, cl]) => `<button class="${cl} ${ch.decision === v ? "on" : ""}" data-choix="${esc(v)}" ${bloque(v) ? `disabled title="${esc(c.garder_impossible)}"` : ""}>${lib}</button>`).join("")}</div>
        ${c.garder_impossible ? `<div class="avert">« Garder » indisponible : ${esc(c.garder_impossible)}</div>` : ""}
        ${pb.map((m) => `<div class="conflit">${esc(m)}</div>`).join("")}
        <textarea placeholder="Raison de la décision (obligatoire)" data-raison>${esc(ch.raison || "")}</textarea></div>
    </div>`;
  }).join("");
  const sp = E.decisions?.sans_preuve || [];
  const pret = faites === cartes.length && !nbConflits && !E.occupe;
  return entete + `<div class="doux" style="font-size:14px">${cartes.length} points en attente : ${esc(detailAttente())}.${sp.length ? ` ${sp.length} inconnu sans preuve collectée (<span class="mono">${esc(sp.join(", "))}</span>) : ni envoyé au modèle, ni reproduit.` : ""}</div>`
    + `<div class="decisions">${html}</div>
    <div class="pied"><button class="bouton vert grand ${pret ? "pret" : ""}" data-action="decider" data-principal id="valider" ${pret ? "" : "disabled"}>${nbConflits ? `${nbConflits} choix à corriger` : `Valider ${faites} / ${cartes.length} et relancer la preuve`}</button>
      <span class="jauge"><i id="jauge" style="width:${faites / (cartes.length || 1) * 100}%"></i></span>
      <span class="doux">Les décisions partent dans la merge request ; la CI reconstruit alors la machine sur une copie isolée.</span></div>`;
}

function pasCI(e, i) {
  const st = e.fin ? (e.code === 0 ? "ok" : "ko") : e.debut ? "en_cours" : "avenir";
  const t = e.fin ? duree(e.duree) : e.debut ? `<span data-depuis="${e.debut}"></span>` : "";
  return `<div class="pas-ci ${st}">${ico(st)}<div><div class="t">${i + 1}. ${esc(e.libelle)}</div><div class="x">${esc(e.explication || "")}</div>${e.resultat ? `<div class="r">${nobr(virgule(e.resultat))}</div>` : ""}</div><div class="duree">${t}</div></div>`;
}

function vueCI() {
  const mr = E.mr, c1 = E.ci1, c2 = E.ci2, code = E.code;
  const entete = teteMachine(VM_LIVE) + `<p class="intro">Le code de reconstruction passe par une merge request ; la CI la vérifie en reconstruisant la machine sur une copie isolée.</p>`;
  if (!mr?.numero) return entete + `<div class="bloc"><div class="vide">${E.audit ? "Merge request en préparation…" : "La merge request est ouverte à la fin de l'audit."}</div></div>`;
  const opD = derniereOp("decider");
  const resultats = {};
  (opD?.pas || []).forEach((p) => { if (p.resultat) resultats[p.cle] = p.resultat; });
  const etat2 = c2 ? (c2.etat === "success" ? etiquetteEtat("ok", "Verte") : ciFinie(c2) ? etiquetteEtat("ko", "Rouge") : etiquetteEtat("en_cours")) : "";
  const etat1 = c1 ? (c1.etat === "success" ? etiquetteEtat("ok", "Verte") : ciFinie(c1) ? etiquetteEtat("bloque", "Bloquée") : etiquetteEtat("en_cours")) : "";
  const r = c2?.rapport, cmp = r?.comparaison?.summary, s = r?.sauvegarde, tm = r?.test_metier;
  // Vérification 1 : montrée tant qu'elle est la seule ; dès que la vérification 2 démarre, elle disparaît.
  const refus1 = ciFinie(c1) && c1.etat !== "success";
  const dur1 = c1 ? `<span class="mono doux" style="font-size:13px">${esc(c1.sha)} · ${c1.duree != null ? duree(c1.duree) : `<span data-depuis="${c1.debut}"></span>`}</span>` : "";
  const bloc1 = !c1 || c2 ? ""
    : `<div class="bloc"><div class="tete"><h2>Vérification 1 · après l'audit</h2><span class="droite">${etat1}${dur1}</span></div>
      <div class="contenu">${refus1
        ? `<b>${c1.attente ?? nbCartes()} décisions humaines en attente : reconstruction non lancée.</b> <span class="doux">La CI refuse de prouver une machine dont on ne sait pas tout. ${E.refus ? `Le garde-fou de bascule a refusé lui aussi : « ${esc(motifRefus(E.refus.motif))} ».` : ""}</span>`
        : `<span class="doux">La forge contrôle la merge request…</span>`}</div></div>`;
  const faits = (c2?.etapes || []).filter((e) => e.fin).length, total = (c2?.etapes || []).length || 7;
  const progression = c2 ? `<div class="progression ${prouve() ? "ok" : ""}"><i style="width:${ciFinie(c2) ? 100 : faits / total * 100}%"></i></div>` : "";
  const verdict = `<div class="chiffres">
      <div class="chiffre"><div class="l">Écarts comparés</div><div class="v">${cmp ? cmp.differences : "–"}</div><div class="s">entre la copie et l'original</div></div>
      <div class="chiffre"><div class="l">Non justifiés</div><div class="v" style="color:${cmp && cmp.unjustified === 0 ? "var(--vert)" : "var(--rouge)"}">${cmp ? cmp.unjustified : "–"}</div><div class="s">bloquants pour la fusion</div></div>
      <div class="chiffre"><div class="l">Données restaurées</div><div class="v">${s ? fr(s.age_h, 1) + " h" : "–"}</div><div class="s">${s ? `âge de l'instantané <span class="mono">${esc(s.instantane)}</span>` : ""}</div></div>
      <div class="chiffre"><div class="l">Test métier</div><div class="v" style="color:${tm?.ok ? "var(--vert)" : "var(--rouge)"}">${tm ? (tm.ok ? "vert" : "rouge") : "–"}</div><div class="s">${tm ? `commande créée, relue, supprimée en ${fr(tm.duree_s, 2)} s` : ""}</div></div>
    </div>`;
  return entete + `
    <div class="bloc"><div class="tete"><h2>Reconstruction de bs-logistique depuis le code</h2><span class="droite">
        ${prouve() ? etiquetteEtat("ok", "Prête à fusionner") : etiquetteEtat("bloque", "Fusion bloquée")}
        <a href="${esc(mr.url)}" target="_blank" rel="noopener">Ouvrir dans la forge ↗</a></span></div>
      <div class="contenu" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <span class="tag">n° ${mr.numero}</span><span class="tag">${esc(mr.branche || "reconstruction/bs-logistique")} → main</span><span class="tag">commit ${esc(c2?.sha || mr.sha)}</span>
        ${code ? `<span class="doux" style="font-size:14px">${code.taches} tâches Ansible · ${code.coffre} secrets au coffre · ${code.paquets ?? "–"} paquets · inconnus jamais appliqués</span>` : ""}
      </div></div>
    ${c2 ? "" : bloc1}
    ${r ? verdict : ""}
    ${c2 ? `<div class="bloc">${progression}<div class="tete"><h2>Vérification 2 · après les décisions</h2><span class="droite">${etat2}<span class="mono doux" style="font-size:13px">${esc(c2.sha)} · ${ciFinie(c2) ? duree(c2.duree) : `<span data-depuis="${c2.debut}"></span>`}</span></span></div>
      ${!c2.demarree && !ciFinie(c2) ? `<div class="contenu doux">Le runner de la forge prend la merge request… <span class="mono" data-depuis="${c2.debut}"></span></div>` : ""}
      <div class="pipeline">${(c2.etapes || []).map((e, i) => pasCI({ ...e, resultat: resultats[e.cle] }, i)).join("")}</div></div>` : ""}
    ${c2 ? bloc1 : ""}`;
}

function vueBascule() {
  const b = E.bascule, opB = derniereOp("basculer");
  const conds = `<div class="bloc"><div class="tete"><h2>Conditions</h2></div><div class="conditions">
      <div>${ico(prouve() ? "ok" : E.ci1 ? "bloque" : "avenir")}<span>CI de la merge request verte <span class="doux">(reconstruction prouvée sur une copie isolée)</span></span></div>
      <div>${ico(prouve() ? "ok" : "avenir")}<span>Copie prête : <span class="mono">sbx-logistique</span>, reconstruite, comparée, test métier vert</span></div>
      <div>${ico("ok")}<span>Retour arrière possible : l'original est éteint, jamais détruit</span></div></div></div>`;
  const entete = teteMachine(VM_LIVE) + `<p class="intro">Remplacer la production par la copie reconstruite depuis le code, et mesurer la coupure réelle.</p>`;
  if (!b) {
    return entete + conds + (E.refus && !prouve() ? `<div class="alerte">Tentative de bascule refusée par le garde-fou : ${esc(motifRefus(E.refus.motif))}</div>` : "")
      + `<div>${bouton({ nom: "basculer", lib: "Basculer la production", ok: prouve() && !E.occupe, rouge: true })}</div>`;
  }
  const coupe = b.coupure_debut && !b.retabli, retabli = !!b.retabli;
  const compteur = retabli ? `${fr(b.coupure, 1)} s` : coupe ? `<span data-depuis="${b.coupure_debut}" data-dixiemes="1"></span>` : "0,0 s";
  const tests = (b.tests || []).map((x) => `<div class="test">${ico(x.ok ? "ok" : "ko")}<div>${esc(x.etape)}<small>${esc(x.detail)}</small></div><span class="doux">${fr(x.duree, 2)} s</span></div>`).join("");
  let bilan = "";
  if (E.phase === "fini" && E.t0) {
    const dec = E.decisions?.date && E.ci1?.fin ? E.decisions.date - E.ci1.fin : null;
    bilan = `<div class="chiffres">
      <div class="chiffre"><div class="l">Parcours complet</div><div class="v">${mmss((E.t_fin || maintenant()) - E.t0)}</div><div class="s">de l'audit à la production</div></div>
      <div class="chiffre"><div class="l">Audit</div><div class="v">${duree(E.audit?.duree)}</div></div>
      <div class="chiffre"><div class="l">Décisions</div><div class="v">${dec ? duree(dec) : "–"}</div></div>
      <div class="chiffre"><div class="l">Preuve CI</div><div class="v">${duree(E.ci2?.duree)}</div></div>
      <div class="chiffre"><div class="l">Coupure</div><div class="v" style="color:var(--vert)">${b.coupure ? fr(b.coupure, 1) + " s" : "–"}</div></div></div>`;
  }
  return entete + `<div class="bloc compteur ${retabli ? "retabli" : coupe ? "coupe" : ""}">
      <div class="l">${retabli ? "Service rétabli · coupure totale, de l'arrêt de l'original au test métier vert" : coupe ? "Service coupé" : "Vérification de la preuve…"}</div>
      <div class="v">${compteur}</div>${retabli ? `<div class="doux">sans geste manuel</div>` : ""}</div>
    ${bilan}
    <div class="deux">
      <div class="bloc"><div class="tete"><h2>Déroulé</h2></div><div class="pipeline">${(opB?.pas || []).map((p, i) => pasCI({ libelle: p.titre, explication: p.explication, resultat: p.resultat,
        debut: p.debut, fin: p.fin, code: p.etat === "ok" ? 0 : 1, duree: p.fin && p.debut ? p.fin - p.debut : null }, i)).join("")}</div></div>
      <div class="bloc"><div class="tete"><h2>Test métier sur la production</h2></div>${tests || `<div class="vide">En attente du redémarrage de la copie…</div>`}</div>
    </div>`;
}

function vueLabo() {
  const p = E.preparation || {}, op = derniereOp("preparer"), r = P?.remise;
  return `<div class="entete"><h1>Laboratoire</h1><p>Coulisses de la démo : préparation avant l'oral et remise en état après. Rien ici n'est montré au jury.</p></div>
    <div class="bloc"><div class="tete"><h2>Préparation</h2><span class="droite">${p.etat === "ok" ? etiquetteEtat("ok", `Prête depuis ${heure(p.date)}`) : p.etat === "en_cours" ? etiquetteEtat("en_cours") : p.etat === "ko" ? etiquetteEtat("ko") : etiquetteEtat("attention", "À faire")}
        <button class="bouton ${p.etat === "ok" ? "second" : ""}" data-action="preparer" ${E.occupe ? "disabled" : ""}>${p.etat === "ok" ? "Refaire" : "Préparer"}</button></span></div>
      <div class="contenu doux">À lancer 10 min avant l'oral : VM joignables, pièges reposés, modèle chargé, propositions calculées, sandbox préchauffée.</div>
      ${op ? `<div class="pipeline">${op.pas.map((x, i) => pasCI({ libelle: x.titre, explication: x.explication, resultat: x.resultat, debut: x.debut, fin: x.fin,
        code: x.etat === "ok" ? 0 : 1, duree: x.fin && x.debut ? x.fin - x.debut : null }, i)).join("")}</div>` : ""}</div>
    <div class="bloc"><div class="tete"><h2>Remise en état</h2><span class="droite"><button class="bouton second" data-action="remettre" ${E.occupe ? "disabled" : ""}>Remettre en état</button></span></div>
      <div class="contenu doux">Après l'oral : copie éteinte, original rallumé, pièges reposés. Résultats de chaque démo dans <span class="mono">banc/resultats/demo-salle-*.json</span>.</div></div>
    <div class="bloc"><div class="tete"><h2>Données de démonstration</h2><span class="droite">${r ? `<button class="bouton second" data-labo="reafficher" ${E.occupe ? "disabled" : ""}>Réafficher l'historique</button>` : ""}
        <button class="bouton second" data-labo="reinitialiser" ${E.occupe ? "disabled" : ""}>Réinitialiser les données</button></span></div>
      <div class="contenu doux">Repart comme avant le premier audit : état de la console, Activité, journal des actions, audits et accès vérifiés du parc ; la merge request ouverte est fermée. Rien n'est supprimé : les fichiers vont dans <span class="mono">inventaires/archives/</span>, les vérifications de la forge et les bascules plus anciennes sont seulement masquées. Registre du parc, décisions versionnées et VM inchangés.
      ${r ? `<br>Historique masqué avant le ${new Date(r.date * 1000).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" })} (${esc(r.par || "?")}) · archives : <span class="mono">${esc(r.archive || "")}</span>.` : ""}</div></div>`;
}

// ---------------------------------------------------------------- parc : tableau de bord, fiches, rapport
const machineP = (vm) => (P?.machines || []).find((m) => m.vm === vm);
const scoreBarre = (pct) => pct == null ? `<span class="pale" title="Le score n'a de sens qu'une fois la reconstruction prouvée">non prouvée</span>`
  : `<span class="score"><span class="barre"><i class="${pct < 100 ? "moyen" : ""}" style="width:${pct}%"></i></span>${fr(pct, pct < 100 ? 1 : 0)} %</span>`;

// Une ligne par machine, mêmes colonnes pour toutes. bs-logistique : l'état de la reprise jouée dans
// cette console (audit, décisions, CI, bascule) ; les autres : leur dernière preuve sur la forge.
function ligneParc(vm) {
  // Machine de la démo : son parcours en direct ; sans parcours (rien d'audité depuis la remise à zéro),
  // son dernier état prouvé sur la forge, comme les autres machines.
  const sansParcours = vm === VM_LIVE && !E.audit && derniereOp("audit")?.etat !== "en_cours" && machineP(vm)?.rapport;
  if (vm === VM_LIVE && !sansParcours) {
    const a = E.audit, opA = derniereOp("audit"), n = nbCartes(), prises = !!E.decisions?.prises;
    let etat, lib;
    if (opA?.etat === "en_cours") [etat, lib] = ["en_cours", "Audit en cours"];
    else if (!a) [etat, lib] = ["attention", "Pas encore auditée"];
    else if (basculeFaite()) [etat, lib] = ["ok", "Prouvée, en production"];
    else if (prouve()) [etat, lib] = ["ok", "Reconstruction prouvée"];
    else if (E.ci2 && ciFinie(E.ci2)) [etat, lib] = ["ko", "Preuve en échec"];
    else if (E.ci2) [etat, lib] = ["en_cours", "Preuve en cours"];
    else if (n && !prises) [etat, lib] = ["bloque", `Bloquée : ${n} décisions en attente`];
    else [etat, lib] = ["en_cours", "Contrôle en cours"];
    const utiles = a ? a.total - (a.comptes.ignore || 0) : 0;
    const pct = a && utiles ? 100 * (utiles - (prises ? 0 : a.comptes.inconnu || 0)) / utiles : null;
    const s = E.ci2?.rapport?.sauvegarde;
    const reg = machineP(vm) || {};
    return { vm, role: reg.role || "Logiciel de logistique, PostgreSQL", ip: reg.ip || "192.168.103.200", criticite: reg.criticite, etat, lib, pct, vers: "ensemble",
      reconstruction: prouve() ? E.ci2.duree : null, donnees: s ? `${fr(s.age_h, 1)} h` : null,
      coupure: E.bascule?.coupure, preuve: prouve() ? `n° ${E.mr.numero} · aujourd'hui à ${heure(E.ci2.fin)}` : null,
      attente: prises ? 0 : n };
  }
  const m = machineP(vm);
  if (!m) return null;
  if (!m.rapport) return ligneIntegration(m);
  const p = m.forge?.preuve, v = p?.verif || {}, s = v.sauvegarde, b = (m.bascules || []).slice(-1)[0];
  const etat = { prouvee: "ok", echec: "bloque" }[m.verdict.code] || "avenir";
  return { vm, role: m.role, ip: m.ip, criticite: m.criticite, etat, lib: m.verdict.lib, pct: m.score?.pct, vers: vm === VM_LIVE ? "ensemble" : "m-" + vm,
    reconstruction: v.chronos?.total_s, donnees: s ? `${fr(s.age_h, 1)} h` : p ? "sans sauvegarde" : null,
    coupure: b?.coupure_s, preuve: p ? `n° ${p.numero} · ${dateFr(p.date)}` : null, age: p ? ilYa(p.date) : "", attente: m.score?.comptes?.attente || 0 };
}

function vueTableau() {
  const vms = [VM_LIVE, ...(P?.machines || []).map((m) => m.vm).filter((v) => v !== VM_LIVE)];
  const lignes = vms.map(ligneParc).filter(Boolean);
  const live = lignes[0], enCours = E.t0 && !E.t_fin;
  // Action recommandée : intégrer bs-logistique, suivre sa reprise, puis lire le rapport.
  // Sans audit dans cette console, la ligne de bs-logistique peut venir d'une preuve plus ancienne sur la forge :
  // la carte le dit, au lieu d'annoncer une machine jamais auditée à côté d'un statut « prouvée ».
  const dejaProuvee = !E.audit && live?.preuve;
  const carte = !E.audit && !enCours
    ? dejaProuvee
      ? `<div class="prochaine"><div class="sur">Action recommandée</div><h2>Dernière preuve de bs-logistique : ${esc(live.age || "lors d'une reprise précédente")}</h2>
        <p>La machine a pu changer depuis (paquets, configuration, données). Nouvel audit en lecture seule, rien n'est modifié sur la machine, puis nouvelle preuve de reconstruction.</p>
        <div class="actions">${bouton({ vers: "ensemble", lib: "Ouvrir bs-logistique", ok: true, grand: true })}</div></div>`
      : `<div class="prochaine"><div class="sur">Action recommandée</div><h2>bs-logistique n'a jamais été auditée</h2>
        <p>Le serveur du logiciel de logistique et de sa base PostgreSQL, sans documentation. Premier audit en lecture seule, rien n'est modifié sur la machine.</p>
        <div class="actions">${bouton({ vers: "ensemble", lib: "Ouvrir bs-logistique", ok: true, grand: true })}</div></div>`
    : enCours ? `<div class="prochaine en_cours"><div class="sur"><span class="ico en_cours"></span>Reprise en cours</div><h2>${esc(live.lib)} sur bs-logistique</h2>
        <p>Démarrée à ${heure(E.t0)} · <span data-depuis="${E.t0}"></span></p>
        <div class="actions">${bouton({ vers: "ensemble", lib: "Suivre la reprise", ok: true, grand: true })}</div></div>`
    : basculeFaite() ? `<div class="prochaine fin"><div class="sur">${ico("ok")}Reprise prouvée</div><h2>Le rapport de reprise de bs-logistique est prêt</h2>
        <p>Verdict, chrono, risques et preuve, générés depuis les résultats de cette reprise. À joindre au plan de continuité.</p>
        <div class="actions">${bouton({ vers: "rapport", lib: "Voir le rapport", ok: true, grand: true })}</div></div>` : "";
  const prouvees = lignes.filter((l) => l.etat === "ok").length, attente = lignes.reduce((x, l) => x + (l.attente || 0), 0);
  const recs = lignes.map((l) => l.reconstruction).filter((x) => x != null);
  const coupures = lignes.map((l) => l.coupure).filter((x) => x != null);
  const chiffres = `<div class="chiffres">
      <div class="chiffre"><div class="l">Machines prouvées</div><div class="v"><span style="color:${prouvees === lignes.length ? "var(--vert)" : "inherit"}">${prouvees}</span><span class="doux" style="font-size:20px"> / ${lignes.length}</span></div><div class="s">reconstruites depuis le code, test métier vert</div></div>
      <div class="chiffre"><div class="l">Décisions en attente</div><div class="v" style="color:${attente ? "var(--ambre)" : "inherit"}">${attente}</div><div class="s">${attente ? "bloquent la preuve" : "rien ne bloque la preuve"}</div></div>
      <div class="chiffre"><div class="l">Reconstruction la plus longue</div><div class="v">${recs.length ? duree(Math.max(...recs)) : "–"}</div><div class="s">VM vide → service vérifié</div></div>
      <div class="chiffre"><div class="l">Coupure mesurée</div><div class="v">${coupures.length ? fr(coupures[coupures.length - 1], 1) + " s" : "–"}</div><div class="s">dernière bascule en production</div></div></div>`;
  const tableau = `<section class="bloc"><div class="tete"><h2>Machines</h2><span class="droite doux">cliquer une ligne pour ouvrir la fiche</span></div>
    <div class="defile-x"><table class="parc"><thead><tr><th>Machine</th><th>Statut de reprise</th><th>Reconstructibilité</th><th>Reconstruction</th><th>Données restaurées</th><th>Coupure</th><th>Dernière preuve</th></tr></thead><tbody>
    ${lignes.map((l) => `<tr data-vers="${l.vers}"><td><div class="nom">${esc(l.vm)}</div><div class="role">${esc(l.role)}${l.criticite ? ` · <span class="pale">${esc(LIB_CRIT[l.criticite] || l.criticite)}</span>` : ""}</div></td>
      <td><span title="${esc(AIDE_ETAT[l.etat] || "")}">${etiquetteEtat(l.etat, l.lib)}</span></td><td title="Part des éléments relevés que le code reproduit ou qu'un humain a tranchés">${scoreBarre(l.pct)}</td>
      <td>${l.reconstruction != null ? duree(l.reconstruction) : "<span class='pale'>–</span>"}</td>
      <td>${l.donnees ? `${esc(l.donnees)}${l.donnees.endsWith("h") ? `<div class="petit">d'âge</div>` : ""}` : "<span class='pale'>–</span>"}</td>
      <td>${l.coupure != null ? `${fr(l.coupure, 1)} s` : `<span class="pale">–</span>`}</td>
      <td>${l.preuve ? `${esc(l.preuve)}${l.age ? `<div class="petit">${esc(l.age)}</div>` : ""}` : "<span class='pale'>aucune</span>"}</td></tr>`).join("")}
    </tbody></table></div>
    </section>`;
  return `<div class="entete avec-actions"><div><h1>Tableau de bord</h1><p>Peut-on reconstruire chaque machine critique, en combien de temps, avec quelles données ? Chaque statut vient d'une reconstruction réelle, jamais d'une estimation.</p></div>
      <div>${bouton({ vers: "ajout", lib: "Ajouter une machine", ok: true }, false).replace('class="bouton ', 'class="bouton second ')}</div></div>
    ${carte}${chiffres}${tableau}${sourceParc()}`;
}

function sourceParc() {
  if (parcErreur) return `<div class="alerte">État du parc indisponible : ${esc(parcErreur)}</div>`;
  return `<div class="source">${P ? `Preuves lues sur la forge (<a href="${esc(P.forge)}/pme/infra/pulls?state=all" target="_blank" rel="noopener">pme/infra</a>) à ${heure(P.date)}` : "Lecture des preuves sur la forge…"}
    <button class="lien" data-parc="force">Actualiser</button></div>`;
}

const ETAPES_PREUVE = [["sandbox_s", "Sandbox isolée", "VM vide clonée d'une Debian vierge, coupée de l'entreprise"], ["reconstruction_s", "Reconstruction depuis le code", "Ansible applique le code de la merge request"],
  ["restauration_s", "Restauration des données", "depuis la dernière sauvegarde restic"], ["redemarrage_s", "Redémarrage", "la configuration doit survivre à un redémarrage"],
  ["collecte_s", "Audit de la copie", "même collecte en lecture seule que sur l'original"], ["comparaison_s", "Comparaison avec l'original", "tout écart doit être justifié"], ["test_metier_s", "Test métier", "le service rend le service attendu"]];


// ---------------------------------------------------------------- modifier une machine
const OPTS_CRIT = (v) => [["critique", "Critique : l'activité s'arrête sans elle"], ["importante", "Importante : l'activité est dégradée"], ["secondaire", "Secondaire : peut attendre"]]
  .map(([k, l]) => `<option value="${k}" ${v === k ? "selected" : ""}>${l}</option>`).join("");
const lienModifier = (vm) => P && editionMachine !== vm ? `<button class="lien" data-modifier-machine="${esc(vm)}" style="margin-left:4px">Modifier</button>` : "";

    <div class="pied-form"><button type="submit" class="bouton">Enregistrer</button><button type="button" class="bouton second" data-modifier-machine="">Annuler</button><span class="erreur-form" id="erreur-machine"></span></div></form>`;
}

// ---------------------------------------------------------------- intégration d'une machine
// Déclarer → installer l'accès de collecte (script relu et lancé par l'entreprise) → vérifier → premier audit.
function ligneIntegration(m) {
  const ac = m.acces, au = m.integration, inc = au?.comptes?.inconnu || 0;
  let etat, lib;
  if (!ac) [etat, lib] = ["avenir", "Accès à installer"];
  else if (ac.etat !== "ok") [etat, lib] = ["ko", "Accès en échec"];
  else if (!au) [etat, lib] = ["attention", "Accès vérifié, audit à lancer"];
  else [etat, lib] = ["attention", inc ? `Auditée : ${inc} inconnu${inc > 1 ? "s" : ""}` : "Auditée, preuve à construire"];
  const utiles = au ? au.total - (au.comptes.ignore || 0) : 0;
  return { vm: m.vm, role: m.role, ip: m.ip, criticite: m.criticite, etat, lib, vers: "m-" + m.vm,
    pct: null, reconstruction: null, donnees: null, coupure: null, preuve: null, attente: inc };
}

const commande = (texte) => `<div class="cmd"><pre>${texte}</pre><button data-copier title="Copier dans le presse-papiers">Copier</button></div>`;
const varCompte = () => `<span class="var" data-var-compte>${esc(compteAdmin)}</span>`;
const REVOQUER = "sudo userdel -r bs-collect && sudo rm -f /usr/local/sbin/bs-collect /usr/local/sbin/bs-collect-ssh /etc/sudoers.d/bs-collect";

function blocAcces(m) {
  const ac = m.acces, ok = ac?.etat === "ok";
  const bt = `<button class="bouton second" data-action="acces" data-vm="${esc(m.vm)}" ${E.occupe ? "disabled" : ""}>${ac ? "Vérifier à nouveau" : "Vérifier l'accès"}</button>`;
  const corps = !ac ? `<div class="contenu doux">Pas encore vérifié depuis la console. La vérification se connecte avec le compte <span class="mono">bs-collect</span>, s'assure qu'il ne peut rien faire d'autre que la collecte et relève le système.</div>`
    : !ok ? `<div class="contenu"><div class="alerte">${esc(ac.erreur || "échec")}</div></div>`
    : `<div class="liste">
      <div>${ico("ok")}<span>Compte <span class="mono">bs-collect</span> limité à la collecte<small>toute autre commande est refusée par le serveur · vérifié le ${jourFr(ac.date)} à ${heure(ac.date)}${ac.par ? ` par ${esc(ac.par)}` : ""}</small></span><span></span></div>
      <div>${ico("ok")}<span>Identité du serveur <span class="mono">${esc(ac.empreinte)}</span><small>exigée à chaque connexion ; à comparer avec l'empreinte affichée par le script d'installation</small></span><span></span></div>
      <div>${ico("ok")}<span>${esc(ac.os || "")}${ac.hostname && ac.hostname !== m.vm ? ` · nom réel <span class="mono">${esc(ac.hostname)}</span>` : ""}<small>${ac.paquets} paquets, ${ac.services} services et unités, ${ac.ports} ports ouverts · collecte d'essai en ${fr(ac.duree_s, 1)} s</small></span><span></span></div></div>`;
  return `<div class="bloc"><div class="tete"><h2>Accès de collecte</h2>${ac ? etiquetteEtat(ok ? "ok" : "ko", ok ? "Vérifié" : "En échec") : ""}<span class="droite">${bt}</span></div>${corps}
    <details class="depli"><summary>Révoquer l'accès</summary><div>À lancer sur <span class="mono">${esc(m.vm)}</span> : le compte, le collecteur et la règle sudo disparaissent. Black Start ne peut plus s'y connecter.${commande(esc(REVOQUER))}</div></details></div>`;
}

function blocInstallation(m) {
  const inst = P?.installateur || {}, cle = P?.cle || {};
  const ip = esc(m.ip), nom = esc(inst.nom || "bs-collect-installer.sh");
  return `<div class="bloc"><div class="tete"><h2>Installer l'accès de collecte</h2><span class="droite doux">par un administrateur de l'entreprise, une seule fois</span></div>
    <div class="contenu"><ol class="etapes-cmd">
      <li><b>Télécharger le script d'installation</b>
        <span class="x">Un seul fichier, lisible avant exécution. Il contient le collecteur et la clé publique de la plateforme.</span>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px"><a class="bouton" href="/installer/${nom}" download>Télécharger ${nom}</a>
          <span class="petit">${inst.taille ? `${Math.round(inst.taille / 1024)} Ko · ` : ""}collecteur ${esc(inst.collecteur || "")}</span></div>
        <span class="petit" style="margin-top:6px">SHA-256 du script : <span class="mono">${esc(inst.sha256 || "")}</span></span></li>
      <li><b>Le copier sur le serveur</b>
        <div class="ligne-champ"><label for="compte">Compte d'administration sur ${esc(m.vm)}</label><input class="compte" id="compte" data-compte value="${esc(compteAdmin)}" spellcheck="false"></div>
        ${commande(`scp ${nom} ${varCompte()}@${ip}:`)}</li>
      <li><b>Le lancer en root</b>
        ${commande(`ssh -t ${varCompte()}@${ip} sudo bash ${nom}`)}
        <span class="x" style="margin-top:6px">À la fin, le script affiche l'empreinte du serveur : gardez-la pour la vérification.</span></li>
    </ol></div>
    <details class="depli"><summary>Ce que fait le script, et ce qu'il ne fait pas</summary><div><ul>
      <li>Il copie le collecteur <span class="mono">bs-collect</span> dans <span class="mono">/usr/local/sbin</span>, après avoir vérifié son empreinte (<span class="mono">${esc((inst.collecteur_sha256 || "").slice(0, 16))}…</span>).</li>
      <li>Il crée le compte système <span class="mono">bs-collect</span>, sans mot de passe ni terminal. Ce compte ne peut lancer qu'une commande : la collecte (commande forcée SSH, règle sudo limitée à ce seul programme).</li>
      <li>Il autorise la clé de la plateforme pour ce seul compte : <span class="mono">${esc(cle.empreinte || "")}</span> (${esc(cle.commentaire || "")}).</li>
      <li>Il installe <span class="mono">python3</span> et <span class="mono">iproute2</span> s'ils manquent. Il ne touche à aucun service ni à aucune configuration existante, et n'ouvre aucun port.</li>
      <li>La collecte lit la machine sans la modifier. Elle n'emporte jamais <span class="mono">/etc/shadow</span>, les clés privées ni les fichiers lisibles par root seul.</li>
      <li>Systèmes pris en charge : Debian 13. Le script refuse de s'exécuter ailleurs que sur Debian.</li></ul></div></details>
    <details class="depli"><summary>Plusieurs serveurs : installer avec Ansible</summary><div>Depuis le poste d'administration de l'entreprise, sur un groupe de serveurs de l'inventaire Ansible :
      ${commande(`ansible <span class="var">serveurs</span> -b -m ansible.builtin.script -a ${nom}`)}</div></details>
    <details class="depli"><summary>Révoquer l'accès plus tard</summary><div>Une commande, sur le serveur :${commande(esc(REVOQUER))}</div></details></div>`;
}

// Âge d'une preuve (« 2026-11-03 13:38 », heure de Paris) : « il y a 2 jours ».
function ilYa(s) {
  const t = Date.parse(String(s || "").replace(" ", "T")); if (!t) return "";
  const h = (Date.now() - t) / 3.6e6;
  return h < 1 ? "il y a moins d'une heure" : h < 24 ? `il y a ${Math.floor(h)} h` : `il y a ${Math.floor(h / 24)} jour${Math.floor(h / 24) > 1 ? "s" : ""}`;
}
const tableIP = (l) => `<table><thead><tr><th>Fichier</th><th style="width:70px">Ligne</th><th>Vers</th></tr></thead><tbody>${l.map((d) =>
  `<tr><td class="cle">${esc(d.fichier ?? d.path)}</td><td class="mono">${d.ligne ?? d.line ?? ""}</td><td><span class="mono">${esc(d.ip)}</span> <span class="doux">${esc(nomIP(d.ip))}</span></td></tr>`).join("")}</tbody></table>`;

function vueMachine(vm, onglet = "resume") {
  const m = machineP(vm);
  if (!m) return `<div class="entete"><h1>${esc(vm)}</h1></div>` + (parcErreur ? sourceParc() : `<div class="vide">Lecture des preuves sur la forge…</div>`);
  if (onglet === "acces") return teteMachine(vm) + `<p class="intro">Le compte de collecte en lecture seule : son état, l'identité du serveur, et comment le révoquer.</p>`
    + (m.rapport ? "" : blocInstallationSiBesoin(m)) + blocAcces(m)
    + `<div class="pied-page">${sourceParc()}${!m.rapport && vm !== VM_LIVE ? `<button class="lien danger" data-retirer="${esc(vm)}">Retirer ${esc(vm)} du parc</button>` : ""}</div>`;
  if (!m.rapport) return vueIntegration(m, onglet);
  // Machine prouvée : l'audit se relance à la demande (lecture seule, résultat hors Git), sans toucher à la preuve.
  if (onglet === "audit") {
    if (m.integration) return vueIntegration(m, "audit");
    const ac = m.acces, ok = ac?.etat === "ok";
    const [nom, lib, texte] = ok
      ? ["integrer", "Lancer l'audit", "Collecte en lecture seule, comparaison avec l'image de référence, classement de chaque écart avec la règle appliquée. Quelques secondes. La preuve de reconstruction n'est pas modifiée."]
      : ["acces", "Vérifier l'accès", "L'audit passe par le compte de collecte en lecture seule. Black Start vérifie d'abord que le compte bs-collect est installé et limité à la collecte."];
    return teteMachine(vm) + (ac && !ok ? `<div class="alerte"><b>Dernière vérification en échec</b> (${jourFr(ac.date)} à ${heure(ac.date)}) : ${esc(ac.erreur)}</div>` : "")
      + `<div class="prochaine"><div class="sur">Audit</div><h2>${ok ? "Auditer " + esc(vm) : "Vérifier l'accès de collecte"}</h2><p>${texte}</p>
        <div class="actions">${bouton({ nom, lib, ok: !E.occupe, grand: true }).replace("<button ", `<button data-vm="${esc(vm)}" `)}</div></div>`
      + `<div class="pied-page">${sourceParc()}</div>`;
  }
  const p = m.forge?.preuve, v = p?.verif || {}, ch = v.chronos || {}, s = v.sauvegarde, tm = v.test_metier, cmp = v.comparaison?.summary;
  const etat = { prouvee: "ok", echec: "bloque" }[m.verdict.code] || "avenir";
  if (onglet === "preuve") {
    const hist = m.forge?.historique || [];
    const chrono = `<section class="bloc"><div class="tete"><h2>Déroulé de la preuve</h2><span class="droite mono doux">${esc(ch.sandbox || "")}</span></div><div class="pipeline">${ETAPES_PREUVE.map(([k, lib, ex], i) =>
      k === "restauration_s" && !s ? pasCI({ libelle: lib, explication: "aucune sauvegarde : rien à restaurer", debut: 1, fin: 1, code: 0, duree: null }, i)
        : pasCI({ libelle: lib, explication: ex, debut: 1, fin: 1, code: 0, duree: ch[k] ?? null }, i)).join("")}</div></section>`;
    const tests = `<section class="bloc"><div class="tete"><h2>Test métier</h2>${tm?.ref ? `<span class="droite mono doux">${esc(tm.ref)}</span>` : ""}</div><div class="liste">${(tm?.etapes || []).map((e) =>
      `<div>${ico(e.ok ? "ok" : "ko")}<span>${esc(e.etape)}<small>${esc(e.detail)}</small></span><span class="doux">${e.duree_s != null ? fr(e.duree_s, 2) + " s" : ""}</span></div>`).join("") || `<div class="vide">–</div>`}</div></section>`;
    const sauv = `<section class="bloc"><div class="tete"><h2>Sauvegarde</h2>${s ? etiquetteEtat(s.trop_vieux ? "attention" : "ok", s.trop_vieux ? "En retard" : "À jour") : ""}</div><div class="liste">${s ? `
      <div>${ico("ok")}<span>Instantané restauré <span class="mono">${esc(s.instantane)}</span><small>pris le ${dateFr(s.date)}, ${fr(s.age_h, 1)} h avant la preuve</small></span><span></span></div>
      <div>${ico("ok")}<span>Tâche planifiée<small class="mono">${esc(s.tache)}</small></span><span></span></div>
      <div>${ico(s.trop_vieux ? "attention" : "ok")}<span>Dernier passage prévu : ${dateFr(s.dernier_passage_prevu)}<small>alerte si l'instantané a plus de ${fr(s.max_h, 0)} h</small></span><span></span></div>`
      : `<div>${ico("attention")}<span>Aucune sauvegarde sur cette machine<small>données régénérables : perte acceptée par décision humaine</small></span><span></span></div>`}</div></section>`;
    const histo = `<details class="depli"><summary>Historique des vérifications de la CI (${hist.length})</summary><div>${hist.length ? `<table><thead><tr><th>Date</th><th>Merge request</th><th>Résultat</th><th style="text-align:right">Durée</th></tr></thead><tbody>${hist.map((h) =>
      `<tr><td>${esc(dateFr(h.date))}</td><td><a href="${esc(h.url)}" target="_blank" rel="noopener">n° ${h.numero}</a> <span class="mono pale">${esc(h.sha)}</span></td>
        <td>${h.verte ? etiquetteEtat("ok", "Verte") + (h.depuis_vide ? "" : ` <span class="pale">copie préchauffée</span>`) : h.attente ? etiquetteEtat("bloque", `Bloquée : ${h.attente} décisions`) : etiquetteEtat("ko", "Rouge")}</td>
        <td style="text-align:right">${h.total_s ? duree(h.total_s) : "–"}</td></tr>`).join("")}</tbody></table>` : "Aucune vérification."}</div></details>`;
    return teteMachine(vm) + `<p class="intro">Comment la reconstruction a été prouvée : une machine vide, le code, la sauvegarde, puis la comparaison et le test métier.</p>`
      + `<div class="grille2">${chrono}<div style="display:grid;gap:28px">${tests}${sauv}</div></div>` + histo;
  }
  if (onglet === "decisions") {
    const decs = Object.entries(m.decisions || {});
    return teteMachine(vm) + `<p class="intro">Ce que personne n'avait documenté, et ce qu'un humain a décidé, avec sa raison. Versionné avec le code.</p>
      <section class="bloc"><div class="tete"><h2>Décisions humaines</h2></div>${decs.length ? `<table><thead><tr><th>Élément</th><th style="width:150px">Décision</th><th>Raison</th></tr></thead><tbody>${decs.map(([k, d]) =>
        `<tr><td class="cle">${esc(k)}</td><td><b>${esc(LIB_DECISION[d.decision] || d.decision)}</b><div class="petit">${esc(d.par || "")}</div></td><td class="doux">${esc(d.raison)}</td></tr>`).join("")}</tbody></table>` : `<div class="vide">Aucune décision nécessaire : chaque élément était expliqué par une règle.</div>`}</section>
      <section class="bloc"><div class="tete"><h2>Risques relevés à l'audit</h2></div><div class="liste">${m.risques.parts.map(([lib, n, st]) =>
        `<div>${ico(n ? "attention" : "ok")}<span>${n} ${esc(lib)}<small>${esc(st)}</small></span><span></span></div>`).join("")}
        ${(m.trous || []).map((t) => `<div>${ico("attention")}<span>${esc(t.replace(/`/g, ""))}</span><span></span></div>`).join("")}</div></section>
      ${(m.ip_en_dur || []).length ? `<details class="depli"><summary>Adresses IP d'autres machines écrites en dur (${m.ip_en_dur.length})</summary><div>${tableIP(m.ip_en_dur)}</div></details>` : ""}`;
  }
  // Résumé : le verdict, l'âge de la preuve, quatre chiffres.
  const verdict = `<div class="prochaine ${etat === "ok" ? "fin" : ""}"><div class="sur">${ico(etat)}${esc(m.verdict.lib)}${p ? ` · ${esc(ilYa(p.date))}` : ""}</div>
    <h2>${p ? `Reconstruite depuis le code en ${duree(ch.total_s)}, test métier ${tm?.ok ? "vert" : "rouge"}` : "Pas encore de preuve de reconstruction"}</h2>
    <p>${p ? `Vérifiée le ${dateFr(p.date)} par la CI de la merge request n° ${p.numero}${cmp ? ` : ${cmp.differences} écarts avec l'original, ${cmp.unjustified} non justifié` : ""}.` : "La CI n'a encore rien vérifié pour cette machine."}</p>
    <div class="actions"><button class="bouton second" data-rapport-vers="${esc(vm)}">Rapport de reprise</button>${p ? `<a class="bouton second" href="${esc(p.url)}" target="_blank" rel="noopener">Merge request ↗</a>` : ""}</div></div>
    ${m.suivi ? `<div class="alerte">${esc(m.suivi)}</div>` : ""}`;
  const chiffres = `<div class="chiffres">
    <div class="chiffre"><div class="l">Reconstructibilité</div><div class="v">${fr(m.score.pct, m.score.pct < 100 ? 1 : 0)} %</div><div class="s">${m.score.traites} éléments sur ${m.score.total} reproduits ou tranchés</div></div>
    <div class="chiffre"><div class="l">Reconstruction</div><div class="v">${ch.total_s ? duree(ch.total_s) : "–"}</div><div class="s">VM vide → service vérifié</div></div>
    <div class="chiffre"><div class="l">Données restaurées</div><div class="v">${s ? fr(s.age_h, 1) + " h" : "–"}</div><div class="s">${s ? "âge de la sauvegarde" : "aucune sauvegarde : perte acceptée"}</div></div>
    <div class="chiffre"><div class="l">Test métier</div><div class="v" style="color:${tm?.ok ? "var(--vert)" : "var(--rouge)"}">${tm ? (tm.ok ? "vert" : "rouge") : "–"}</div><div class="s">${tm ? `${tm.etapes.length} vérifications en ${fr(tm.duree_s, 2)} s` : ""}</div></div></div>`;
  return teteMachine(vm) + verdict + chiffres + sourceParc();
}

// Machine en cours d'intégration : résumé (où en est-on, quoi faire), audit (écarts), accès.
function blocInstallationSiBesoin(m) { return m.acces?.etat === "ok" ? "" : blocInstallation(m); }
function vueIntegration(m, onglet = "resume") {
  const ac = m.acces, ok = ac?.etat === "ok", au = m.integration;
  const enCours = (cle) => { const o = opEnCours(); return o && o.cle === cle && o.vm === m.vm; };
  if (onglet === "audit" && au) {
    const c = au.comptes;
    return teteMachine(m.vm) + `<p class="intro">Tout ce qui distingue ${esc(m.vm)} de l'image de référence, avec la règle qui a classé chaque écart. Audit du ${jourFr(au.date)} à ${heure(au.date)}${au.par ? ` par ${esc(au.par)}` : ""}.</p>`
      + `<div>${repartition(au)}</div>`
      + `<section class="bloc"><div class="tete"><div class="filtres">${[["tous", "Tous", au.total], ...ORDRE.map((st) => [st, STATUTS[st][0], c[st] || 0])].map(([k, lib, n]) =>
          `<button class="filtre ${filtre === k ? "on" : ""}" data-filtre="${k}">${k !== "tous" ? `<i class="pt c-${k}"></i>` : ""}${lib} <b>${n}</b></button>`).join("")}</div>
          <input type="search" placeholder="Chercher un fichier, un paquet…" id="recherche" value="${esc(recherche)}">
          <button class="bouton second" data-export>Exporter (CSV)</button>
          <button class="bouton second" data-action="integrer" data-vm="${esc(m.vm)}" ${E.occupe ? "disabled" : ""}>Refaire l'audit</button></div>
        <table><thead><tr><th style="width:120px">Statut</th><th>Élément</th><th style="width:190px">Type</th><th>Pourquoi</th></tr></thead><tbody id="lignes">${lignesInventaire()}</tbody></table></section>
      ${(au.ip_en_dur || []).length ? `<details class="depli"><summary>Adresses IP d'autres machines écrites en dur (${au.ip_en_dur.length})</summary><div>${tableIP(au.ip_en_dur)}</div></details>` : ""}`;
  }
  const etapes = [
    { titre: "Déclarée", etat: "ok", court: `le ${dateFr(m.ajoutee_le + " 00:00").replace(/ à .*/, "")}${m.ajoutee_par ? ` par ${m.ajoutee_par}` : ""}` },
    { titre: "Accès de collecte", etat: enCours("acces") ? "en_cours" : ok ? "ok" : ac ? "ko" : "attention", court: enCours("acces") ? "vérification…" : ok ? `vérifié le ${jourFr(ac.date)}` : ac ? "en échec" : "à installer" },
    { titre: "Premier audit", etat: enCours("integrer") ? "en_cours" : au ? "ok" : ok ? "attention" : "avenir", court: enCours("integrer") ? "en cours…" : au ? `${au.total} écarts, ${au.comptes.inconnu || 0} inconnus` : ok ? "à lancer" : "après l'accès" },
    { titre: "Preuve de reconstruction", etat: "avenir", court: "sauvegarde, test métier, CI" },
  ];
  const courante = etapes.find((x) => x.etat !== "ok");
  const file = `<div class="fileplan">${etapes.map((x, i) => `<div class="e ${x === courante ? "courante" : ""} ${x.etat === "ok" ? "fait" : ""}">
      <div class="rang">${ico(x.etat)}<span class="num">Étape ${i + 1}</span></div><div class="t">${esc(x.titre)}</div><div class="c">${esc(x.court)}</div></div>`).join("")}</div>`;
  const bt = (nom, lib) => bouton({ nom, lib, ok: !E.occupe, grand: true }).replace("<button ", `<button data-vm="${esc(m.vm)}" `);
  let corps;
  if (!ok) {
    corps = (ac ? `<div class="alerte"><b>Dernière vérification en échec</b> (${jourFr(ac.date)} à ${heure(ac.date)}) : ${esc(ac.erreur)}</div>` : "")
      + `<div class="prochaine"><div class="sur">À faire maintenant</div><h2>Installer l'accès, puis le vérifier</h2>
          <p>Un administrateur lance le script d'installation sur le serveur (ci-dessous). Black Start vérifie ensuite que le compte <span class="mono">bs-collect</span> est limité à la collecte. Rien n'est modifié sur la machine.</p>
          <div class="actions">${bt("acces", "Vérifier l'accès")}</div></div>` + blocInstallation(m);
  } else if (!au) {
    corps = `<div class="prochaine"><div class="sur">À faire maintenant</div><h2>Lancer le premier audit</h2>
        <p>Collecte en lecture seule, comparaison avec l'image de référence, classement de chaque écart avec la règle appliquée. Quelques secondes.</p>
        <div class="actions">${bt("integrer", "Lancer le premier audit")}</div></div>`;
  } else {
    const c = au.comptes, liste = (st) => au.elements.filter((x) => x.statut === st).map((x) => x.cle);
    const donnees = liste("donnee"), secrets = liste("secret"), inc = c.inconnu || 0;
    corps = `<div class="chiffres">
      <div class="chiffre"><div class="l">Écarts relevés</div><div class="v">${au.total}</div><div class="s">en ${duree(au.duree_s)}, en lecture seule</div></div>
      <div class="chiffre"><div class="l">Inconnus</div><div class="v" style="color:${inc ? "var(--ambre)" : "var(--vert)"}">${inc}</div><div class="s">${inc ? "un humain doit trancher" : "tout est expliqué"}</div></div>
      <div class="chiffre"><div class="l">Secrets</div><div class="v">${c.secret || 0}</div><div class="s">pour le coffre, jamais dans Git</div></div>
      <div class="chiffre"><div class="l">Données</div><div class="v">${c.donnee || 0}</div><div class="s">dossiers à sauvegarder</div></div></div>
      <section class="bloc"><div class="tete"><h2>Ce qui reste avant la preuve de reconstruction</h2><span class="droite"><button class="lien" data-vers="m-${esc(m.vm)}~audit">Voir les ${au.total} écarts</button></span></div><div class="liste">
      <div>${ico(inc ? "attention" : "ok")}<span>${inc ? `${inc} élément${inc > 1 ? "s" : ""} inconnu${inc > 1 ? "s" : ""} à trancher` : "Aucun élément inconnu"}<small>${inc ? "une décision et une raison par élément ; le modèle local propose, un humain décide" : "chaque écart a une règle qui l'explique"}</small></span><span></span></div>
      <div>${ico(donnees.length ? "attention" : "ok")}<span>${donnees.length ? `${donnees.length} dossier${donnees.length > 1 ? "s" : ""} de données à confier à la sauvegarde` : "Aucun dossier de données"}<small class="mono">${esc(donnees.map((k) => k.replace(/^data:/, "")).join(", "))}</small></span><span></span></div>
      <div>${ico(secrets.length ? "attention" : "ok")}<span>${secrets.length} secret${secrets.length > 1 ? "s" : ""} à mettre au coffre<small class="mono">${esc(secrets.map((k) => k.replace(/^file:/, "")).join(", "))}</small></span><span></span></div>
      <div>${ico("avenir")}<span>Test métier à écrire<small>ce que la machine doit rendre comme service, vérifié après chaque reconstruction</small></span><span></span></div>
      <div>${ico("avenir")}<span>Code de reconstruction, merge request et CI<small>générés depuis cet audit ; la CI reconstruit la machine sur une copie isolée et la compare à l'original</small></span><span></span></div></div>
      <p class="intro" style="margin-top:12px">Ces étapes forment la migration de la machine, menée avec un consultant Black Start. Ensuite, la preuve tourne seule à chaque changement.</p></section>`;
  }
  return teteMachine(m.vm) + file + corps + `<div class="pied-page">${sourceParc()}</div>`;
}

function vueAjout() {
  const pe = P?.perimetre || {};
  return `<div class="entete"><div class="fil-page">Machines</div><h1>Ajouter une machine</h1>
      <p>Déclarez un serveur de l'entreprise. Black Start ne s'y connecte qu'une fois l'accès de collecte installé par vos soins, avec un script que vous pouvez relire.</p></div>
    <form class="bloc formulaire" id="form-ajout" autocomplete="off">
      <div class="champ"><label for="f-vm">Nom de la machine</label><input id="f-vm" name="vm" class="mono" placeholder="srv-compta" required pattern="[a-z0-9][a-z0-9\\-]{1,40}" spellcheck="false">
        <small>Minuscules, chiffres et tirets. C'est le nom affiché dans le parc et dans les rapports.</small></div>
      <div class="champ"><label for="f-ip">Adresse IP</label><input id="f-ip" name="ip" class="mono" placeholder="${esc((pe.reseaux || ["192.168.0.0/24"])[0].replace(/\.0\/\d+$/, ".x"))}" required pattern="\\d{1,3}(\\.\\d{1,3}){3}" spellcheck="false">
        <small>Réseaux autorisés : <span class="mono">${esc((pe.reseaux || []).join(", ") || "aucun")}</span></small></div>
      <div class="champ large"><label for="f-role">Rôle</label><input id="f-role" name="role" placeholder="Ex. : logiciel de comptabilité et sa base PostgreSQL" required maxlength="160">
        <small>Le service que cette machine rend à l'entreprise. Il guidera le test métier.</small></div>
      <div class="champ"><label for="f-crit">Criticité</label><select id="f-crit" name="criticite">${OPTS_CRIT("importante")}</select></div>
      <div class="champ"><label>Système</label><div style="height:38px;display:flex;align-items:center;font-size:14px">Debian 13</div><small>Seul système pris en charge pour l'instant.</small></div>
      <div class="pied-form"><button type="submit" class="bouton grand">Déclarer la machine</button><span class="erreur-form" id="erreur-ajout"></span></div>
    </form>
    <div class="bloc"><div class="tete"><h2>Ce que Black Start demande, et ce qu'il ne demande pas</h2></div><div class="liste">
      <div>${ico("ok")}<span>Un compte dédié, <span class="mono">bs-collect</span>, limité à une seule commande : la collecte en lecture seule<small>pas de mot de passe, pas de terminal, pas d'accès administrateur pour Black Start</small></span><span></span></div>
      <div>${ico("ok")}<span>Vous installez l'accès vous-même<small>un script autonome, identifié par son empreinte SHA-256, que vous pouvez relire avant de le lancer</small></span><span></span></div>
      <div>${ico("ok")}<span>Rien ne quitte le site<small>forge, modèle local et sandbox tournent chez vous ; les secrets ne vont jamais dans Git ni au modèle</small></span><span></span></div>
      <div>${ico("ok")}<span>Révocable à tout moment, en une commande<small class="mono">${esc(REVOQUER)}</small></span><span></span></div></div></div>`;
}

function vueParametres() {
  if (!P) return `<div class="entete"><h1>Paramètres</h1></div>` + sourceParc();
  const pe = P.perimetre || {}, ref = P.reference || {}, pf = P.plateforme || {}, cle = P.cle || {}, inst = P.installateur || {};
  const ligne = (k, v) => `<div>${esc(k)}</div><div>${v}</div>`;
  const lignes = (o) => Object.entries(o || {}).map(([k, v]) => `${k} ${v}`).join("\n");
  const enEdition = (s) => edition === s;
  const btModif = (s) => enEdition(s) ? "" : `<button class="bouton second" data-editer="${s}" ${edition ? "disabled" : ""}>Modifier</button>`;
  const pied = `<div class="pied-form"><button type="submit" class="bouton">Enregistrer</button><button type="button" class="bouton second" data-editer="">Annuler</button><span class="erreur-form" id="erreur-reglages"></span></div>`;
  const form = (s, champs) => `<form class="formulaire" id="form-reglages" data-section="${s}" autocomplete="off">${champs}${pied}</form>`;
  const champ = (lib, html, aide = "", large = false) => `<div class="champ ${large ? "large" : ""}"><label>${esc(lib)}</label>${html}${aide ? `<small>${aide}</small>` : ""}</div>`;
  const verrou = `<span class="droite doux" title="Ces réglages déterminent la CI et la sandbox : ils se changent à l'installation de la plateforme.">fixé à l'installation · lecture seule</span>`;

  const org = enEdition("organisation") ? form("organisation",
      champ("Nom de l'organisation", `<input name="organisation" value="${esc(P.organisation || "")}" required maxlength="80">`, "Affiché en haut de la console et sur la couverture du rapport.")
      + champ("Description", `<input name="description" value="${esc(P.description || "")}" maxlength="160">`, "Une ligne, reprise sous le nom dans le rapport."))
    : `<div class="reglages">${ligne("Nom", esc(P.organisation || ""))}${ligne("Description", esc(P.description || "") || "<span class='pale'>–</span>")}${ligne("Machines déclarées", `${(P.machines || []).length}`)}</div>`;
  const per = enEdition("perimetre") ? form("perimetre",
      champ("Réseaux autorisés", `<textarea name="reseaux" rows="3" class="mono" spellcheck="false">${esc((pe.reseaux || []).join("\n"))}</textarea>`, "Un réseau par ligne, notation CIDR (192.168.10.0/24). Black Start refuse toute connexion en dehors.")
      + champ("Adresses exclues", `<textarea name="exclues" rows="4" class="mono" spellcheck="false">${esc(lignes(pe.exclues))}</textarea>`, "Une par ligne : l'adresse, puis pourquoi. Jamais contactées, même dans un réseau autorisé."))
    : `<div class="reglages">${ligne("Réseaux autorisés", `<span class="mono">${esc((pe.reseaux || []).join(", "))}</span>`)}
      ${ligne("Adresses exclues", Object.entries(pe.exclues || {}).map(([ip, lib]) => `<span class="mono">${esc(ip)}</span> <span class="doux">${esc(lib)}</span>`).join("<br>") || "aucune")}</div>`;

const VUES = { tableau: ["Tableau de bord", vueTableau], ajout: ["Ajouter une machine", vueAjout], parametres: ["Paramètres", vueParametres], ensemble: ["Résumé", vueEnsemble], parc: ["Infrastructure", vueParc], inventaire: ["Audit", vueInventaire],
  decisions: ["Décisions", vueDecisions], ci: ["Preuve", vueCI], bascule: ["Bascule", vueBascule], rapport: ["Rapport de reprise", vueRapport], journal: ["Journal", vueJournal], labo: ["Laboratoire", vueLabo] };
// Fiche machine : « m-<vm> » (résumé) ou « m-<vm>~<onglet> ». bs-logistique garde ses vues de démo (ensemble, inventaire…).
const ONGLETS_LIVE = ["ensemble", "inventaire", "decisions", "ci", "bascule"];
const vueMachineDe = (v) => { if (ONGLETS_LIVE.includes(v)) return [VM_LIVE, v]; if (!v.startsWith("m-")) return null; const [vm, o] = v.slice(2).split("~"); return [vm, o || "resume"]; };
const LIB_ONGLET = { resume: "Résumé", ensemble: "Résumé", inventaire: "Audit", audit: "Audit", decisions: "Décisions", ci: "Preuve", preuve: "Preuve", bascule: "Bascule", acces: "Accès" };
function vueDe(v) {
  if (VUES[v]) return VUES[v];
  const mv = vueMachineDe(v);
  if (!mv) return null;
  if (mv[0] === VM_LIVE && mv[1] === "resume") return VUES.ensemble;
  return [mv[0], () => vueMachine(mv[0], mv[1])];
}

// En-tête commun des fiches machine : nom, rôle, repères, puis les onglets.
function ongletsDe(vm) {
  const m = machineP(vm), k = (o) => (vm === VM_LIVE && ONGLETS_LIVE.includes(o) ? o : `m-${vm}~${o}`);
  if (vm === VM_LIVE) {
    return [["ensemble", "Résumé"], ["inventaire", "Audit", E.audit ? E.audit.total : ""], ["decisions", "Décisions", ...badgeDecisions()],
      ["ci", "Preuve", prouve() ? "verte" : E.ci2 && !ciFinie(E.ci2) ? "en cours" : E.ci1 && ciFinie(E.ci1) ? "bloquée" : "", prouve() ? "vert" : E.ci1 && ciFinie(E.ci1) && !E.ci2 ? "rouge" : "ambre"],
      ["bascule", "Bascule"], [k("acces"), "Accès"]];
  }
  if (m?.rapport) return [[`m-${vm}`, "Résumé"], [k("audit"), "Audit", m.integration?.total ?? ""], [k("preuve"), "Preuve"], [k("decisions"), "Décisions", Object.keys(m.decisions || {}).length || ""], [k("acces"), "Accès"]];
  return [[`m-${vm}`, "Résumé"], ...(m?.integration ? [[k("audit"), "Audit", m.integration.total]] : []), [k("acces"), "Accès"]];
}
// Onglet Décisions : ce qui reste à faire, recalculé à chaque choix et à chaque frappe dans une raison.
// Chiffre ambre = décisions encore incomplètes, rouge = dont au moins une contradiction, « prêtes » = tout est
// rempli et cohérent, « signées » = envoyées dans la merge request.
function badgeDecisions() {
  const cartes = E.decisions?.cartes || [];
  if (!cartes.length) return ["", ""];
  if (E.decisions?.prises) return ["signées", "vert"];
  const conflits = conflitsDecisions(cartes);
  const restantes = cartes.filter((c) => conflits[c.cle] || !(choix[c.cle]?.decision && choix[c.cle]?.raison?.trim())).length;
  return restantes ? [restantes, Object.keys(conflits).length ? "rouge" : "ambre"] : ["prêtes", "vert"];
}
function majOngletDecisions() {
  const b = document.querySelector('.onglets [data-vers="decisions"]');
  if (!b) return;
  const [n, cl] = badgeDecisions();
  b.innerHTML = `Décisions${n !== "" ? `<span class="badge ${cl}">${esc(n)}</span>` : ""}`;
}
function teteMachine(vm) {
  const m = machineP(vm) || {}, os = m.acces?.os || (vm === VM_LIVE ? E.audit?.machine?.os : "");
  const onglets = ongletsDe(vm).map(([k, lib, n, cl]) => `<button class="${vue === k ? "on" : ""}" data-vers="${esc(k)}">${esc(lib)}${n !== "" && n != null ? `<span class="badge ${cl || ""}">${esc(n)}</span>` : ""}</button>`).join("");
  return `<div class="entete"><h1>${esc(vm)}</h1><p>${esc(m.role || "")}</p>

}
