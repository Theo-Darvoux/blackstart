<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Start · console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Console Black Start : thème sombre unique, voulu (vidéoprojecteur). */
:root {
  color-scheme: dark;
  /* Identité Black Start (identite/) : noir #07090A, vert #3DFF8A, blanc cassé #E8F2EC. */
  --fond: #07090A; --barre: #090c0b; --panneau: #0d1110; --panneau2: #121816; --survol: #161d1a;
  --trait: #1a2220; --trait2: #26302d;
  --texte: #E8F2EC; --doux: #96a59e; --pale: #5e6b66;
  --ambre: #f2b443; --ambre-fond: rgba(242,180,67,.12); --vert: #3DFF8A; --vert-fond: rgba(61,255,138,.10);
  --rouge: #ff6b63; --rouge-fond: rgba(255,107,99,.12); --bleu: #6cb4ff; --bleu-fond: rgba(108,180,255,.12);
  --violet: #b9a1ff; --violet-fond: rgba(185,161,255,.08); --compris: #7f938a; --ignore: #3d4945;
  --accent: #3DFF8A;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fond); color: var(--texte); font: 400 15px/1.55 var(--sans); overflow: hidden;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--texte); text-decoration: underline; text-decoration-color: var(--trait2); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--doux); }
.mono { font-family: var(--mono); font-size: .92em; }
.doux { color: var(--doux); } .pale { color: var(--pale); }
.app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- barre du haut ---------- */
.haut { display: flex; align-items: center; gap: 18px; padding: 0 24px; background: var(--barre); border-bottom: 1px solid var(--trait); }
.marque { display: flex; align-items: center; padding-right: 18px; border-right: 1px solid var(--trait); height: 24px; }
.marque .logo { height: 18px; width: auto; display: block; }
.fil { display: flex; align-items: center; gap: 8px; color: var(--doux); font-size: 14px; }
.fil b { color: var(--texte); font-weight: 500; }
.fil .sep { color: var(--pale); }
.fil .env { font-size: 12px; color: var(--doux); border: 1px solid var(--trait2); border-radius: 6px; padding: 1px 7px; margin-left: 6px; }
.haut .droite { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pastille { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--trait); background: var(--panneau); font-size: 13px; color: var(--doux); white-space: nowrap; }
.pastille i { width: 7px; height: 7px; border-radius: 50%; background: var(--pale); }
.pastille.ok i { background: var(--vert); } .pastille.attention i { background: var(--ambre); } .pastille.ko i { background: var(--rouge); }
.pastille.en_cours i { background: var(--ambre); animation: battre 1.2s infinite; }
.pastille b { color: var(--texte); font-weight: 600; }
.utilisateur { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--doux); padding-left: 10px; margin-left: 4px; border-left: 1px solid var(--trait); }
.utilisateur span { width: 28px; height: 28px; border-radius: 50%; background: var(--panneau2); border: 1px solid var(--trait2); color: var(--texte); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.utilisateur small { display: block; color: var(--pale); font-size: 12px; line-height: 1.2; }
.utilisateur div { line-height: 1.25; color: var(--texte); }
@keyframes battre { 50% { opacity: .35; } }

/* ---------- corps ---------- */
.corps { display: grid; grid-template-columns: 232px minmax(0, 1fr) 360px; min-height: 0; }
nav { background: var(--barre); border-right: 1px solid var(--trait); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
nav .titre-nav { font-size: 12px; font-weight: 500; color: var(--pale); padding: 18px 12px 6px; }
nav .titre-nav:first-child { padding-top: 0; }
nav button { display: flex; align-items: center; gap: 11px; width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--doux); text-align: left; font-size: 14px; font-weight: 500; }
nav button svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button:hover { background: var(--survol); color: var(--texte); }
nav button.actif { background: var(--panneau2); color: var(--texte); }
nav button.actif svg { color: var(--vert); }
nav .badge { white-space: nowrap; margin-left: auto; font-size: 12px; font-weight: 500; min-width: 20px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--panneau2); color: var(--doux); display: inline-grid; place-items: center; }
nav .badge.ambre { background: var(--ambre-fond); color: var(--ambre); } nav .badge.vert { background: var(--vert-fond); color: var(--vert); }
nav .badge.rouge { background: var(--rouge-fond); color: var(--rouge); }
nav .badge svg.i { width: 12px; height: 12px; stroke-width: 2.6; }
nav .bas { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--trait); }
nav button.sous { height: 32px; padding-left: 38px; font-size: 13.5px; font-weight: 400; }
nav button.sous svg { width: 14px; height: 14px; }
nav button.machine-nav { font-family: var(--mono); font-size: 13.5px; }
nav button.machine-nav .pt { width: 7px; height: 7px; border-radius: 50%; }

/* tableau de bord : parc */
.pt.ok { background: var(--vert); } .pt.bloque, .pt.ko { background: var(--rouge); } .pt.attention, .pt.en_cours { background: var(--ambre); } .pt.avenir { background: var(--pale); }
table.parc td { vertical-align: middle; }
table.parc td:nth-child(n+4), table.parc th { white-space: nowrap; }
table.parc td:nth-child(n+5) { white-space: normal; min-width: 96px; }
table.parc tr[data-vers] { cursor: pointer; } table.parc tr[data-vers]:hover td { background: var(--survol); }
table.parc .nom { font: 500 14px var(--mono); white-space: nowrap; }
table.parc td, table.parc th { padding-left: 14px; padding-right: 14px; } table.parc td:first-child, table.parc th:first-child { padding-left: 22px; min-width: 180px; }
table.parc .score .barre { width: 44px; } table.parc th { white-space: normal; }
.defile-x { overflow-x: auto; }
a.bouton { text-decoration: none; } table.parc .role { font-size: 13px; color: var(--doux); margin-top: 2px; }
.score { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.score .barre { width: 72px; height: 6px; border-radius: 3px; background: var(--trait2); overflow: hidden; }
.score .barre i { display: block; height: 100%; background: var(--vert); }
.score .barre i.moyen { background: var(--ambre); }
.petit { font-size: 12.5px; color: var(--pale); }
.source { font-size: 13px; color: var(--pale); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lien { background: none; border: 0; padding: 0; color: var(--doux); text-decoration: underline; text-decoration-color: var(--trait2); text-underline-offset: 3px; font-size: 13px; }
.lien:hover { color: var(--texte); }
.grille2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.liste { display: grid; }
.liste > div { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; padding: 12px 22px; border-top: 1px solid var(--trait); font-size: 14px; align-items: start; }
.liste > div:first-child { border-top: 0; }
.liste small { display: block; color: var(--doux); font-size: 13px; margin-top: 2px; }
.cadre-rapport { width: 100%; border: 1px solid var(--trait); border-radius: var(--r); background: #fff; min-height: 900px; display: block; }
@media (max-width: 1100px) { .grille2 { grid-template-columns: 1fr; } }

/* intégration d'une machine : formulaire, commandes à copier, réglages */
.entete.avec-actions { display: flex; gap: 24px; align-items: flex-start; justify-content: space-between; }
.entete.avec-actions > div:last-child { flex: none; padding-top: 4px; }
.formulaire { padding: 24px 24px 22px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 24px; }
.champ { display: grid; gap: 6px; align-content: start; }
.champ.large { grid-column: 1 / -1; }
.champ label { font-size: 13px; font-weight: 500; color: var(--texte); }
.champ small { font-size: 12.5px; color: var(--pale); }
.champ input, .champ select, input.compte { background: var(--fond); border: 1px solid var(--trait2); border-radius: 8px; color: var(--texte); height: 38px; padding: 0 12px; font: 14px var(--sans); outline: none; width: 100%; }
.champ textarea { background: var(--fond); border: 1px solid var(--trait2); border-radius: 8px; color: var(--texte); padding: 9px 12px; font: 13.5px/1.5 var(--mono); outline: none; width: 100%; resize: vertical; }
.champ textarea:focus { border-color: var(--vert); box-shadow: 0 0 0 3px rgba(61,255,138,.12); }
.bloc > .formulaire { border-top: 0; }
.champ input:disabled { color: var(--pale); }
.champ input.mono, input.compte { font-family: var(--mono); font-size: 13.5px; }
.champ input:focus, .champ select:focus, input.compte:focus { border-color: var(--vert); box-shadow: 0 0 0 3px rgba(61,255,138,.12); }
.champ input:invalid:not(:placeholder-shown) { border-color: rgba(255,107,99,.6); }
.formulaire .pied-form { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding-top: 4px; }
.erreur-form { color: var(--rouge); font-size: 14px; }
.etapes-cmd { margin: 0; padding: 0; list-style: none; counter-reset: e; display: grid; gap: 22px; }
.etapes-cmd > li { counter-increment: e; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 14px; }
.etapes-cmd > li::before { content: counter(e); grid-row: 1 / span 4; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--trait2); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--doux); }
.etapes-cmd > li > * { grid-column: 2; }
.etapes-cmd b { font-weight: 600; }
.etapes-cmd .x { color: var(--doux); font-size: 14px; }
.cmd { display: flex; align-items: stretch; background: var(--fond); border: 1px solid var(--trait2); border-radius: 8px; margin-top: 6px; overflow: hidden; }
.cmd pre { margin: 0; padding: 10px 14px; font: 13px/1.5 var(--mono); color: var(--texte); white-space: pre-wrap; word-break: break-all; flex: 1; }
.cmd pre .var { color: var(--vert); }
.cmd button { border: 0; border-left: 1px solid var(--trait2); background: var(--panneau2); color: var(--doux); padding: 0 14px; font-size: 13px; flex: none; }
.cmd button:hover { color: var(--texte); background: var(--survol); }
.ligne-champ { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--doux); }
.ligne-champ input.compte { width: 180px; height: 32px; }
.depli { border-top: 1px solid var(--trait); }
.depli summary { padding: 14px 22px; cursor: pointer; font-size: 14px; color: var(--doux); list-style: none; display: flex; gap: 8px; align-items: center; }
.depli summary::-webkit-details-marker { display: none; }
.depli summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
.depli[open] summary::before { transform: rotate(45deg); }
.depli summary:hover { color: var(--texte); }
.depli > div { padding: 0 22px 18px; font-size: 14px; color: var(--doux); }
.depli ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.reglages { display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.reglages > div { padding: 13px 22px; border-top: 1px solid var(--trait); font-size: 14px; min-width: 0; }
.reglages > div:nth-child(-n+2) { border-top: 0; }
.reglages > div:nth-child(odd) { color: var(--doux); }
.reglages .mono { word-break: break-all; }
.pied-page { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.lien.danger:hover { color: var(--rouge); }
nav button.ajout { color: var(--pale); font-size: 13.5px; }
nav button.ajout:hover { color: var(--texte); }
@media (max-width: 1100px) { .formulaire { grid-template-columns: 1fr; } .reglages { grid-template-columns: 1fr; } .entete.avec-actions { flex-direction: column; } }

main { overflow: auto; min-width: 0; }
.vue { padding: 36px 48px 72px; display: flex; flex-direction: column; gap: 28px; max-width: 1320px; }
.vue.entree { animation: entree .22s ease-out; }
@keyframes entree { from { opacity: 0; transform: translateY(6px); } }
.nobr { white-space: nowrap; }
.entete .fil-page { font-size: 13px; color: var(--pale); margin-bottom: 8px; }
.entete h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -.015em; }
.entete p { margin: 6px 0 0; color: var(--doux); font-size: 15px; max-width: 72ch; }
.entete .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--panneau2); border: 1px solid var(--trait); color: var(--doux); }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
.bloc { background: var(--panneau); border: 1px solid var(--trait); border-radius: var(--r); }
.bloc > .tete { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 12px 22px; border-bottom: 1px solid var(--trait); }
.bloc > .tete .droite { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; }
.bloc > .contenu { padding: 20px 22px; }
.vide { padding: 40px 22px; text-align: center; color: var(--doux); font-size: 14px; }
.bandeau-erreur { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0 16px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,107,99,.28); }
.bandeau-erreur svg { flex: none; width: 20px; height: 20px; margin-top: 1px; fill: none; stroke: var(--rouge); stroke-width: 2; stroke-linecap: round; }
.bandeau-erreur .texte { display: grid; gap: 3px; min-width: 0; flex: 1; }
.bandeau-erreur b { color: var(--texte); font-weight: 600; font-size: 15px; }
.bandeau-erreur span { color: var(--doux); font-size: 14px; overflow-wrap: anywhere; }
.bandeau-erreur .lien { flex: none; align-self: center; color: var(--rouge); }
.erreur-op { border-left: 2px solid var(--rouge); padding: 2px 0 2px 12px; margin-bottom: 14px; color: var(--doux); font-size: 14px; overflow-wrap: anywhere; }
.alerte { background: var(--rouge-fond); border: 1px solid rgba(255,107,99,.35); color: #ffd7d6; padding: 12px 16px; border-radius: var(--r); font-size: 14px; }

.bouton { border: 1px solid transparent; border-radius: 8px; height: 38px; padding: 0 16px; font-weight: 500; font-size: 14px; background: var(--accent); color: #03140a; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: filter .15s; }
.bouton:hover:not(:disabled) { filter: brightness(1.08); }
.bouton.vert { background: var(--vert); color: #03140a; }
.bouton.rouge { background: var(--rouge); color: #1d0405; }
.bouton.second { background: var(--panneau2); color: var(--texte); border-color: var(--trait2); }
.bouton.second:hover:not(:disabled) { background: var(--survol); filter: none; }
.bouton:disabled { background: var(--panneau2); color: var(--pale); border-color: var(--trait); cursor: not-allowed; }
.bouton.grand { height: 44px; padding: 0 22px; font-size: 15px; font-weight: 600; }

/* prochaine étape */
.prochaine { border-radius: var(--r); padding: 28px 30px; background: var(--panneau); border: 1px solid var(--trait); box-shadow: inset 3px 0 0 var(--vert);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 32px; align-items: center; }
.prochaine.en_cours { box-shadow: inset 3px 0 0 var(--ambre); }
.prochaine .sur { grid-column: 1; font-size: 13px; font-weight: 500; color: var(--doux); display: flex; align-items: center; gap: 8px; }
.prochaine .sur .ico { width: 14px; height: 14px; border-width: 2px; }
.prochaine h2 { grid-column: 1; font-size: 20px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
.prochaine p { grid-column: 1; margin: 0; color: var(--doux); font-size: 15px; max-width: 64ch; }
.prochaine .actions { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.prochaine .note { grid-column: 1; font-size: 13px; color: var(--pale); margin-top: 4px; }
/* fin de la reprise : verdict */
.prochaine.fin { background: linear-gradient(100deg, rgba(61,255,138,.10), var(--panneau) 60%); border-color: rgba(61,255,138,.35); padding: 32px 34px; }
.prochaine.fin .sur { color: var(--vert); }
.prochaine.fin h2 { font-size: 24px; }
.prochaine .gros { text-align: right; }
.prochaine .gros .v { font-size: 56px; font-weight: 600; line-height: 1; letter-spacing: -.03em; color: var(--vert); }
.prochaine .gros .l { font-size: 13px; color: var(--doux); margin-top: 6px; }

/* plan de reprise : stepper relié */
.fileplan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px; }
.fileplan .e { all: unset; box-sizing: border-box; padding: 18px 18px 18px; border-radius: 8px; display: grid; gap: 4px; align-content: start; position: relative; cursor: default; }
.fileplan .e[data-vers] { cursor: pointer; } .fileplan .e[data-vers]:hover { background: var(--survol); }
.fileplan .e .rang { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.fileplan .e .rang::after { content: ""; flex: 1; height: 1px; background: var(--trait2); }
.fileplan .e:last-child .rang::after { display: none; }
.fileplan .e.fait .rang::after { background: rgba(61,255,138,.4); }
.fileplan .e .num { font-size: 12px; color: var(--pale); }
.fileplan .e .t { font-weight: 600; font-size: 15px; }
.fileplan .e .c { font-size: 13px; color: var(--doux); }
.fileplan .e.courante .t { color: var(--texte); }
.fileplan .e.courante::before { content: ""; position: absolute; left: 18px; right: 18px; bottom: 0; height: 2px; background: var(--vert); border-radius: 2px; }

/* badges d'état */
.etat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; height: 22px; padding: 0 8px; border-radius: 6px; white-space: nowrap; }
.etat::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.etat.ok { background: var(--vert-fond); color: var(--vert); } .etat.ko { background: var(--rouge-fond); color: var(--rouge); }
.etat.bloque { background: var(--rouge-fond); color: var(--rouge); } .etat.attention { background: var(--ambre-fond); color: var(--ambre); }
.etat.en_cours { background: var(--ambre-fond); color: var(--ambre); } .etat.avenir { background: var(--panneau2); color: var(--pale); }
.etat.saute { background: var(--panneau2); color: var(--doux); }

/* icônes d'état */
.ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1.5px solid var(--trait2); color: transparent; }
.ico svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ico.ok { background: var(--vert); border-color: var(--vert); color: #03140a; }
.ico.ko { background: var(--rouge); border-color: var(--rouge); color: #1d0405; }
.ico.bloque { background: var(--rouge-fond); border-color: var(--rouge); color: var(--rouge); }
.ico.attention { background: var(--ambre-fond); border-color: var(--ambre); color: var(--ambre); }
.ico.saute { border-style: dashed; color: var(--pale); }
.ico.en_cours { border: 2px solid var(--ambre); border-right-color: transparent; animation: tourner .9s linear infinite; }
@keyframes tourner { to { transform: rotate(360deg); } }

/* chiffres */
.chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0; background: var(--panneau); border: 1px solid var(--trait); border-radius: var(--r); }
.chiffre { padding: 20px 22px; border-left: 1px solid var(--trait); }
.chiffre:first-child { border-left: 0; }
.chiffre .l { font-size: 13px; color: var(--doux); }
.chiffre .v { font-size: 28px; font-weight: 600; line-height: 1.2; margin-top: 6px; letter-spacing: -.01em; white-space: nowrap; }
@media (max-width: 1400px) { .chiffre .v { font-size: 23px; } .chiffre { padding: 18px 18px; } }
.chiffre .s { font-size: 12px; color: var(--pale); margin-top: 4px; }

/* répartition */
.repart { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--trait); gap: 2px; }
.repart i { display: block; height: 100%; }
.legende { display: flex; gap: 8px 22px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; }
.legende span { display: inline-flex; align-items: center; gap: 7px; color: var(--doux); }
.legende b { color: var(--texte); font-weight: 600; }
.pt { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.c-inconnu { background: var(--ambre); } .c-secret { background: var(--violet); } .c-donnee { background: var(--bleu); }
.c-compris { background: var(--compris); } .c-ignore { background: var(--ignore); }

/* parc */
.zones { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.machine { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 22px; border-top: 1px solid var(--trait); }
.machine:first-of-type { border-top: 0; }
.machine .n { font-weight: 500; } .machine .r { font-size: 13px; color: var(--doux); }
.machine .ip { font: 400 12.5px var(--mono); color: var(--pale); text-align: right; }
.machine .ip small { display: block; font-family: var(--sans); font-size: 12px; }
.point { width: 8px; height: 8px; border-radius: 50%; background: var(--pale); }
.point.ok { background: var(--vert); } .point.ko { background: var(--rouge); }
.point.actif { background: var(--ambre); animation: battre .9s infinite; } .point.eteint { background: var(--trait2); }
.machine.surbrillance { background: rgba(242,180,67,.05); }

/* tableaux */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--pale); padding: 10px 22px; border-bottom: 1px solid var(--trait); position: sticky; top: 0; background: var(--panneau); }
td { padding: 12px 22px; border-bottom: 1px solid var(--trait); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tr.el { cursor: pointer; } tr.el:hover td { background: var(--survol); }
tr.detail td { background: var(--panneau2); padding-top: 16px; padding-bottom: 18px; }
td.cle { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.statut { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.filtres { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; background: var(--fond); border: 1px solid var(--trait); border-radius: 8px; padding: 3px; }
.filtre { border: 0; background: none; border-radius: 6px; height: 28px; padding: 0 10px; font-size: 13px; color: var(--doux); display: inline-flex; gap: 7px; align-items: center; }
.filtre:hover { color: var(--texte); }
.filtre.on { color: var(--texte); background: var(--panneau2); }
.filtre b { color: var(--pale); font-weight: 500; } .filtre.on b { color: var(--doux); }
input[type=search] { background: var(--fond); border: 1px solid var(--trait); border-radius: 8px; color: var(--texte); height: 34px; padding: 0 12px; font: 13px var(--sans); width: 260px; margin-left: auto; outline: none; }
input[type=search]:focus, .dec textarea:focus { border-color: var(--trait2); box-shadow: 0 0 0 3px rgba(61,255,138,.12); }

/* propositions du modèle */
.propo { border: 1px solid rgba(185,161,255,.22); background: var(--violet-fond); padding: 12px 14px; border-radius: 8px; font-size: 14px; }
.propo .q { color: var(--doux); margin-top: 6px; font-size: 13px; }
.propo .t { color: var(--violet); font-weight: 500; font-size: 12px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

/* décisions */
.decisions { display: grid; gap: 16px; }
.dec { padding: 20px 24px; display: grid; gap: 12px 28px; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
.dec .info, .dec .geste { display: grid; gap: 12px; align-content: start; }
.dec .geste .choix { justify-self: stretch; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.dec .geste textarea { height: 96px; }
@media (max-width: 1500px) { .dec { grid-template-columns: minmax(0, 1fr); } .dec .geste .choix { justify-self: start; display: inline-flex; } .dec .geste textarea { height: 42px; } }
.dec.prise { border-color: rgba(61,255,138,.3); }
.dec .haut-dec { display: flex; gap: 12px; align-items: baseline; }
.dec .cle { font: 500 14px var(--mono); color: var(--texte); word-break: break-all; }
.dec .n { font-size: 12px; color: var(--pale); margin-left: auto; }
.dec .constat { color: var(--doux); font-size: 14px; }
.dec .lie { color: var(--doux); font-size: 13px; }
.dec .avert { color: var(--ambre); font-size: 13px; }
.dec .conflit { color: var(--rouge); font-size: 13px; border-left: 2px solid var(--rouge); padding-left: 10px; }
.dec.en-erreur { border-color: rgba(255,107,99,.55); }
.bandeau-erreur ul { margin: 2px 0 0; padding-left: 18px; display: grid; gap: 4px; color: var(--doux); font-size: 14px; }
.choix button:disabled { opacity: .35; cursor: not-allowed; }
.choix button:disabled:hover { color: var(--doux); background: none; }
.choix { display: inline-flex; gap: 4px; background: var(--fond); border: 1px solid var(--trait); border-radius: 8px; padding: 3px; justify-self: start; }
.choix button { border: 0; background: none; border-radius: 6px; height: 32px; padding: 0 16px; font-weight: 500; font-size: 14px; color: var(--doux); }
.choix button:hover { color: var(--texte); background: var(--survol); }
.choix button.on.reproduire { background: var(--vert); color: #03140a; }
.choix button.on.non { background: var(--rouge); color: #1d0405; }
.choix button.on.accepter { background: var(--bleu); color: #04101f; }
.dec textarea { width: 100%; background: var(--fond); color: var(--texte); border: 1px solid var(--trait); border-radius: 8px; padding: 9px 12px; font: 14px/1.5 var(--sans); resize: vertical; min-height: 42px; height: 42px; outline: none; }
.pied { position: sticky; bottom: -72px; padding: 16px 0 72px; background: linear-gradient(transparent, var(--fond) 30%); display: flex; gap: 16px; align-items: center; font-size: 13px; }
.pied .jauge { width: 140px; height: 6px; border-radius: 3px; background: var(--trait2); overflow: hidden; flex: none; }
.pied .jauge i { display: block; height: 100%; background: var(--vert); transition: width .25s; }
.bouton.pret { box-shadow: 0 0 0 4px rgba(61,255,138,.18); }
@media (max-width: 1500px) { .pied > .doux { display: none; } }

/* progression de la CI */
.progression { height: 3px; background: var(--trait); }
.progression i { display: block; height: 100%; background: var(--ambre); }
.progression.ok i { background: var(--vert); }

/* pipeline CI */
.pipeline { display: grid; }
.pas-ci { display: grid; grid-template-columns: 20px minmax(0, 1fr) 90px; gap: 14px; padding: 14px 22px; border-top: 1px solid var(--trait); align-items: start; }
.pas-ci:first-child { border-top: 0; }
.pas-ci .t { font-weight: 500; } .pas-ci .x { font-size: 13px; color: var(--doux); margin-top: 2px; }
.pas-ci .r { font-size: 13px; color: var(--vert); margin-top: 4px; } .pas-ci.ko .r { color: var(--rouge); }
.pas-ci .duree { font-size: 13px; text-align: right; color: var(--doux); }
.pas-ci.avenir .t, .pas-ci.avenir .x { color: var(--pale); }
.pas-ci.en_cours { background: rgba(242,180,67,.04); }

/* bascule */
.compteur { text-align: center; padding: 30px 26px; }
.compteur .l { color: var(--doux); font-size: 14px; }
.compteur .v { font-size: 76px; font-weight: 600; line-height: 1.1; letter-spacing: -.03em; margin: 6px 0 2px; }
.compteur.coupe .v { color: var(--rouge); } .compteur.retabli .v { color: var(--vert); }
.conditions { display: grid; }
.conditions div { display: flex; gap: 14px; align-items: center; padding: 14px 22px; border-top: 1px solid var(--trait); font-size: 14px; }
.conditions div:first-child { border-top: 0; }
.test { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 22px; border-top: 1px solid var(--trait); font-size: 14px; }
.test small { display: block; color: var(--doux); font-size: 13px; }
.deux { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }

/* ---------- panneau d'activité ---------- */
aside { background: var(--barre); border-left: 1px solid var(--trait); display: flex; flex-direction: column; min-height: 0; }
aside .tete-a { height: 56px; padding: 0 22px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--trait); }
aside .tete-a h2 { font-size: 14px; font-weight: 600; }
aside .defile { overflow: auto; flex: 1; min-height: 0; }
.op { padding: 20px 22px 24px; }
.op .titre-op { font-weight: 600; font-size: 15px; line-height: 1.35; }
.op .sous { display: flex; gap: 10px; align-items: center; margin: 8px 0 22px; font-size: 12px; color: var(--pale); }
.pas { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 18px; }
.pas::before { content: ""; position: absolute; left: 9.5px; top: 24px; bottom: 4px; width: 1px; background: var(--trait2); }
.pas:last-child::before { display: none; }
.pas.ok::before { background: rgba(61,255,138,.35); }
.pas .t { font-weight: 500; font-size: 14px; display: flex; gap: 8px; align-items: baseline; line-height: 1.4; padding-top: 1px; }
.pas .t .duree { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--pale); white-space: nowrap; }
.pas .m { font: 400 11.5px var(--mono); color: var(--pale); margin-top: 3px; }
.pas .x { font-size: 13px; color: var(--doux); margin-top: 6px; }
.pas .r { font-size: 13px; margin-top: 3px; color: var(--doux); overflow-wrap: anywhere; }
.pas.ko .r, .pas.bloque .r { color: #ff9b95; }
.pas.avenir .t { color: var(--pale); }
.pas.en_cours .t { color: var(--texte); font-weight: 600; }
.pas.en_cours .x { color: var(--texte); }
.historique { border-top: 1px solid var(--trait); padding: 14px 12px 16px; }
.historique .titre-nav { font-size: 12px; font-weight: 500; color: var(--pale); padding: 2px 10px 8px; }
.historique button { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--doux); }
.historique button:hover, .historique button.on { background: var(--panneau2); color: var(--texte); }
.historique .mono { font-size: 11.5px; color: var(--pale); }
.sortie { border-top: 1px solid var(--trait); }
.sortie summary { padding: 13px 22px; cursor: pointer; font-size: 13px; color: var(--doux); list-style: none; display: flex; align-items: center; gap: 8px; }
.sortie summary::-webkit-details-marker { display: none; }
.sortie summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
.sortie[open] summary::before { transform: rotate(45deg); }
.sortie pre { margin: 0; padding: 0 22px 14px; max-height: 240px; overflow: auto; font: 11.5px/1.55 var(--mono); color: var(--pale); white-space: pre-wrap; word-break: break-all; }

@media (max-width: 1400px) { .corps { grid-template-columns: 212px minmax(0, 1fr) 330px; } .vue { padding: 32px 36px 64px; } }
@media (max-width: 1100px) {
  .fileplan { grid-template-columns: 1fr 1fr; } .prochaine { grid-template-columns: 1fr; padding: 22px; }
  .prochaine .actions { grid-column: 1; grid-row: auto; align-items: flex-start; }
  body { overflow: auto; } .app { height: auto; } .corps { grid-template-columns: 1fr; }
  nav { flex-direction: row; flex-wrap: wrap; } nav button { width: auto; } nav .titre-nav, nav .bas { display: none; }
  aside { border-left: 0; border-top: 1px solid var(--trait); } .zones, .deux { grid-template-columns: 1fr; }
  .vue { padding: 24px 16px; } .fil { display: none; } .marque { border: 0; }
}

/* ================= Mise en page sans blocs (5 nov.) =================
   Une page continue : titres, filets fins et tableaux pleine largeur. Seule l'action à faire maintenant
   garde un accent (filet vert à gauche). */
.vue { gap: 32px; max-width: 1240px; }
.entete p { max-width: 80ch; }
.intro { margin: -14px 0 0; color: var(--doux); font-size: 15px; max-width: 80ch; }
.bloc { background: none; border: 0; border-radius: 0; border-top: 1px solid var(--trait2); }
.bloc > .tete { padding: 18px 0 8px; min-height: 0; border-bottom: 0; }
.bloc > .tete h2 { font-size: 16px; }
.bloc > .contenu { padding: 8px 0 0; }
.bloc table th:first-child, .bloc table td:first-child, .depli table th:first-child, .depli table td:first-child { padding-left: 0; }
.bloc table th:last-child, .bloc table td:last-child { padding-right: 0; }
th { background: var(--fond); }
.liste > div { padding: 12px 0; }
.pipeline .pas-ci { padding: 13px 0; }
.vide { padding: 22px 0; text-align: left; }
.machine { padding: 14px 0; }
.reglages > div { padding: 12px 0; }
.reglages > div:nth-child(odd) { padding-right: 20px; }
.bloc > .formulaire, .formulaire { padding: 20px 0 8px; }
form.bloc.formulaire { border-top: 1px solid var(--trait2); }
.depli { border-top: 1px solid var(--trait); }
.depli summary { padding: 14px 0; }
.depli > div { padding: 0 0 16px; }
/* chiffres : une bande entre deux filets */
.chiffres { background: none; border: 0; border-radius: 0; border-top: 1px solid var(--trait2); border-bottom: 1px solid var(--trait2); }
.chiffre { padding: 18px 22px 18px 0; border-left: 0; }
.chiffre + .chiffre { padding-left: 22px; border-left: 1px solid var(--trait); }
/* action à faire maintenant : un filet d'accent, pas une carte */
.prochaine { background: none; border: 0; border-radius: 0; box-shadow: none; border-left: 3px solid var(--vert); padding: 6px 0 6px 22px; }
.prochaine.en_cours { border-left-color: var(--ambre); box-shadow: none; }
.prochaine.fin { background: none; border: 0; border-left: 3px solid var(--vert); padding: 6px 0 6px 22px; }
.prochaine h2 { font-size: 19px; }
.prochaine.fin h2 { font-size: 21px; }
/* plan de reprise et étapes d'intégration : une frise à plat */
.fileplan { padding: 0; border-top: 1px solid var(--trait2); border-bottom: 1px solid var(--trait2); }
.fileplan .e { padding: 16px 18px 16px 0; border-radius: 0; }
.fileplan .e.courante::before { left: 0; right: 18px; }
.fileplan .e[data-vers]:hover { background: none; } .fileplan .e[data-vers]:hover .t { text-decoration: underline; text-underline-offset: 3px; }
/* décisions : une par ligne, séparées par un filet */
.decisions { gap: 0; }
.decisions .bloc.dec { padding: 22px 0; }
.dec.prise { border-color: var(--trait2); box-shadow: inset 3px 0 0 var(--vert); padding-left: 16px !important; }
.compteur { border-top: 0; }
/* onglets de la fiche machine */
.onglets { display: flex; gap: 26px; margin-top: 20px; border-bottom: 1px solid var(--trait2); flex-wrap: wrap; }
.onglets button { background: none; border: 0; padding: 10px 0 11px; margin-bottom: -1px; color: var(--doux); font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; display: inline-flex; gap: 8px; align-items: center; }
.onglets button:hover { color: var(--texte); }
.onglets button.on { color: var(--texte); border-bottom-color: var(--vert); }
.onglets .badge { font-size: 11.5px; height: 18px; min-width: 18px; padding: 0 6px; border-radius: 5px; background: var(--panneau2); color: var(--doux); display: inline-grid; place-items: center; }
.onglets .badge.ambre { background: var(--ambre-fond); color: var(--ambre); } .onglets .badge.vert { background: var(--vert-fond); color: var(--vert); } .onglets .badge.rouge { background: var(--rouge-fond); color: var(--rouge); }
/* panneau Activité : toujours visible à droite (il remplit l'écran et raconte chaque opération) */
.vue { max-width: none; }
</style>

  <div class="corps">

    <main><div class="vue" id="vue"></div></main>
    <aside>

</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fr = (x, d = 1) => Number(x).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const mmss = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const duree = (s) => s == null ? "" : s < 10 ? `${fr(s, 1)} s` : s < 60 ? `${Math.round(s)} s` : `${Math.floor(s / 60)} min ${String(Math.round(s % 60)).padStart(2, "0")} s`;
const heure = (t) => new Date(t * 1000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
// Noms de machine jamais coupés au trait d'union ; décimales à la française dans les textes des scripts.
const nobr = (t) => esc(t).replace(/(bs|sbx)-[a-z]+/g, (m) => `<span class="nobr">${m}</span>`);
const virgule = (t) => String(t ?? "").replace(/(\d)\.(\d+)( h| s)\b/g, "$1,$2$3");
const CAPTURE = location.hash.startsWith("#capture");
let E = null, decalage = 0, signature = "", opChoisie = null, ouverts = new Set();
let P = null, parcErreur = null;   // état de reprise du parc (/parc : résultats réels via rapport/bs-rapport)
let vue = (location.hash.replace(/^#(capture-?)?/, "") || "tableau");
let filtre = "tous", recherche = "";
const choix = {};           // décisions en cours de saisie : cle -> {decision, raison}
const maintenant = () => Date.now() / 1000 + decalage;

const STATUTS = {
  inconnu: ["Inconnu", "un humain doit trancher"], secret: ["Secret", "va au coffre, jamais dans Git ni au modèle"],
  donnee: ["Donnée", "sauvegardée puis restaurée"], compris: ["Compris", "reproduit par le code"], ignore: ["Bruit", "ignoré, avec la règle qui le justifie"],
};
const ORDRE = ["inconnu", "secret", "donnee", "compris", "ignore"];
const CATEGORIES = { pkg: "paquet", "pkg-manual": "paquet installé à la main", file: "fichier", "unit-file": "unité systemd", unit: "service",
  cron: "tâche planifiée", data: "dossier de données", process: "processus", listen: "port ouvert", user: "compte", group: "groupe",
  alternative: "alternative Debian", mount: "point de montage", sysctl: "réglage du noyau", timer: "minuterie systemd", "pkgfile-modified": "fichier de paquet modifié" };
const ECARTS = { "ajouté-dans-B": "ajouté", "différent": "modifié", "absent-de-B": "retiré" };

// Libellés affichés des décisions ; les valeurs envoyées restent celles de bs-decider.py.
const LIB_DECISION = { reproduire: "Garder", "ne pas reproduire": "Retirer", accepter: "Accepter la perte" };
const SVG = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const COCHE = SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>');
const ICO = { ok: COCHE, ko: SVG('<path d="M7 7l10 10M17 7L7 17"/>'), bloque: SVG('<path d="M12 7v6M12 17h.01"/>'),
  attention: SVG('<path d="M12 7v6M12 17h.01"/>'), saute: SVG('<path d="M7 12h10"/>'), en_cours: "", avenir: "" };

const ICONES = {
  ensemble: '<path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  parc: '<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>',

  ci: '<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M8.3 7l7.4 3.8"/>',
  bascule: '<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
  labo: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/>',

  rapport: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  ajout: '<path d="M12 5v14M5 12h14"/>',
  journal: '<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>',
  parametres: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
};
const VM_LIVE = "bs-logistique";   // la machine dont la reprise se joue dans cette console
// Nom affiché pour une adresse IP : machine du parc, machine de la plateforme, ou adresse connue du registre.
function nomIP(ip) {

const AIDE_ETAT = { ok: "Reconstruite depuis le code sur une machine vide, test métier vert", bloque: "Des décisions humaines manquent : la CI refuse de reconstruire",
  attention: "Une action vous attend (audit, décisions)", avenir: "Pas encore de preuve : machine déclarée, accès ou audit à faire", ko: "La dernière tentative a échoué", en_cours: "Une opération tourne" };
const LIB_CRIT = { critique: "critique", importante: "importante", secondaire: "secondaire" };
let compteAdmin = "admin";   // compte d'administration de l'entreprise, pour les commandes à copier
let edition = null, editionMachine = null;   // bloc des Paramètres en cours de modification ; machine en cours de modification
let rapportChoix = "parc";   // périmètre du rapport affiché : parc complet ou une machine

let JR = null;               // journal des actions (/journal)
let filtreJournal = "tout";

let activiteOuverte = false, dernierOpVu = null;

try { compteAdmin = localStorage.getItem("bs-compte-admin") || "admin"; } catch (e) { /* stockage indisponible */ }
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
// « 2026-11-03 13:38 » (dates de la forge et des rapports, heure de Paris) → « 3 nov. à 13:38 »
const jourFr = (t) => { const d = new Date(t * 1000); return `${d.getDate()} ${MOIS[d.getMonth()]}`; };
const dateFr = (s) => { const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d:\d\d)/.exec(s || ""); return m ? `${+m[3]} ${MOIS[+m[2] - 1]} à ${m[4]}` : (s || ""); };

// ---------------------------------------------------------------- état dérivé
const ops = () => E.operations || [];
const derniereOp = (cle) => [...ops()].reverse().find((o) => !cle || o.cle === cle);
const opEnCours = () => ops().find((o) => o.etat === "en_cours");
const ciFinie = (c) => c && ["success", "failure", "error"].includes(c.etat);
const prouve = () => E.ci2?.etat === "success";
const basculeFaite = () => E.phase === "fini" && E.bascule?.ok;
const nbCartes = () => E.decisions?.cartes?.length || 0;
// Les décisions en attente = les inconnus + les données sans sauvegarde (cartes « data: »).
function detailAttente() {
  const c = E.decisions?.cartes || [], d = c.filter((x) => x.cle.startsWith("data:")).length, i = c.length - d;
  return [i ? `${i} inconnu${i > 1 ? "s" : ""}` : "", d ? `${d} donnée${d > 1 ? "s" : ""} sans sauvegarde` : ""].filter(Boolean).join(" + ");
}
const motifRefus = (m) => String(m || "").replace(/^refusé\s*:\s*/i, "");

function plan() {
  // Une ligne par étape du plan de reprise : état, résumé court (pastille), et ce que la carte
  // « Prochaine étape » dit quand c'est son tour (titre, explication, action).
  const opA = derniereOp("audit"), auditEnCours = opA && opA.etat === "en_cours";
  const prepOk = E.preparation?.etat === "ok";
  const c1 = E.ci1, c2 = E.ci2, b = E.bascule, n = nbCartes();
  const r = [];
  // 1. Audit
  if (auditEnCours) r.push({ titre: "Audit", etat: "en_cours", court: "en cours…", vers: E.audit ? "inventaire" : null });
  else if (E.audit) r.push({ titre: "Audit", etat: "ok", vers: "inventaire",
    court: `${E.audit.total} écarts, dont ${E.audit.comptes.inconnu || 0} inconnus` });
  else r.push({ titre: "Audit", etat: "attention", court: "à lancer",
    grand: "Auditer la machine",
    texte: "Black Start se connecte en lecture seule, relève tout ce qui distingue ce serveur d'une Debian neuve et le classe. Rien n'est modifié.",
    action: { nom: "audit", lib: "Lancer l'audit", ok: prepOk && !E.occupe },
    note: prepOk ? "Environ 10 secondes." : "Le laboratoire n'est pas prêt : Laboratoire → Préparer." });
  // 2. Décisions
  if (E.decisions?.prises) r.push({ titre: "Décisions", etat: "ok", vers: "decisions",
    court: `${Object.keys(E.decisions.prises).length} signées ${E.par}` });
  else if (n && !auditEnCours) r.push({ titre: "Décisions", etat: "attention", vers: "decisions", court: `${n} en attente`,
    grand: `Trancher les ${n} points en attente`,
    texte: `${detailAttente()}. Personne ne les a documentés. Le modèle local donne son avis sur chacun ; vous décidez, avec une raison.`,
    action: { vers: "decisions", lib: "Prendre les décisions", ok: true },
    note: "Tant qu'ils ne sont pas tranchés, la CI refuse de reconstruire la machine." });
  else r.push({ titre: "Décisions", etat: "avenir", court: "après l'audit" });
  // 3. Preuve
  if (prouve()) r.push({ titre: "Preuve", etat: "ok", vers: "ci", court: `CI verte en ${duree(c2.duree)}` });
  else if (c2 && ciFinie(c2)) r.push({ titre: "Preuve", etat: "ko", vers: "ci", court: "CI rouge",
    grand: "La reconstruction n'est pas prouvée", texte: c2.echec ? `La CI a échoué : ${c2.echec}.` : "La CI a échoué : voir le détail.",
    action: { vers: "ci", lib: "Voir la CI", ok: true } });
  else if (c2) {
    const k = (c2.etapes || []).filter((x) => x.debut).length;
    r.push({ titre: "Preuve", etat: "en_cours", vers: "ci", court: k ? `étape ${k} sur 7` : "la CI démarre…" });
  } else if (c1 && ciFinie(c1) && c1.etat !== "success") r.push({ titre: "Preuve", etat: "bloque", vers: "ci", court: "bloquée : décisions en attente" });
  else if (c1) r.push({ titre: "Preuve", etat: "en_cours", vers: "ci", court: "contrôle CI…" });
  else r.push({ titre: "Preuve", etat: "avenir", court: "reconstruction sur une copie isolée" });
  // 4. Bascule
  if (basculeFaite()) r.push({ titre: "Bascule", etat: "ok", vers: "bascule", court: `coupure de ${fr(b.coupure, 1)} s` });
  else if (E.phase === "fini") r.push({ titre: "Bascule", etat: "ko", vers: "bascule", court: "test métier rouge",
    grand: "Revenir à l'original", texte: "Le test métier est rouge après la bascule. L'original est intact : on peut y revenir.",
    action: { vers: "labo", lib: "Ouvrir le laboratoire", ok: true } });
  else if (b) r.push({ titre: "Bascule", etat: "en_cours", vers: "bascule", court: "en cours…" });
  else if (prouve()) r.push({ titre: "Bascule", etat: "attention", vers: "bascule", court: "prête",
    grand: "Basculer la production sur la copie prouvée",
    texte: "La copie reconstruite depuis le code a passé la CI. L'original sera éteint, pas détruit : retour arrière possible.",
    action: { nom: "basculer", lib: "Basculer la production", ok: !E.occupe, rouge: true, vers: "bascule" },
    note: "La coupure de service est chronométrée." });
  else if (E.refus) r.push({ titre: "Bascule", etat: "bloque", vers: "bascule", court: "refusée sans preuve" });
  else r.push({ titre: "Bascule", etat: "avenir", court: "interdite sans preuve" });
  return r;
}

// ---------------------------------------------------------------- morceaux communs
const ico = (etat) => `<span class="ico ${etat}">${ICO[etat] ?? ""}</span>`;

function bouton(a, principal = true) {
  const cls = (a.rouge ? "rouge" : a.vert ? "vert" : "") + (a.grand ? " grand" : "");
  return `<button class="bouton ${cls}" ${a.nom ? `data-action="${a.nom}"` : ""} ${a.vers ? `data-vers="${a.vers}"` : ""} ${principal ? "data-principal" : ""} ${a.ok ? "" : "disabled"}>${esc(a.lib)}</button>`;
}
function repartition(a) {
  const n = a.total || 1;
  return `<div class="repart">${ORDRE.map((s) => `<i class="c-${s}" style="width:${(a.comptes[s] || 0) / n * 100}%"></i>`).join("")}</div>
    <div class="legende">${ORDRE.map((s) => `<span><i class="pt c-${s}"></i><b>${a.comptes[s] || 0}</b>${STATUTS[s][0].toLowerCase()} · ${STATUTS[s][1]}</span>`).join("")}</div>`;
}
function proposition(p) {
  if (!p) return "";
  return `<div class="propo"><div class="t">Proposition du modèle local · ${esc(LIB_PROPO[p.statut] || p.statut)} · risque ${esc(p.risque === "eleve" ? "élevé" : p.risque)}</div>${esc(p.raison)}<div class="q">Question à l'administrateur : ${esc(p.question)}</div></div>`;
}

// ---------------------------------------------------------------- vues
function prochaine(etapes) {
  // Carte du haut : ce qui se passe maintenant, ou la seule chose à faire ensuite.
  const cour = opEnCours();
  if (cour) {
    const p = cour.pas.find((x) => x.etat === "en_cours");
    const fait = cour.pas.filter((x) => x.etat !== "avenir" && x.etat !== "en_cours").length;
    const vers = { audit: "inventaire", decider: "ci", basculer: "bascule", preparer: "labo", remettre: "labo" }[cour.cle] || (cour.vm ? "m-" + cour.vm : null);
    return `<div class="prochaine en_cours"><div class="sur"><span class="ico en_cours"></span>${nobr(cour.titre)} · pas ${fait + 1} sur ${cour.pas.length}</div>
      <h2>${esc(p ? p.titre : cour.titre)}</h2>
      <p>${esc(p ? p.explication : "")}</p>
      <div class="note">Démarré à ${heure(cour.debut)} · <span data-depuis="${cour.debut}"></span> · détail de chaque pas dans le panneau Activité</div>
      <div class="actions">${vers ? `<button class="bouton second" data-vers="${vers}">Voir le détail</button>` : ""}</div></div>`;
  }
  const e = etapes.find((x) => x.grand);
  if (!e) {
    if (basculeFaite()) return `<div class="prochaine fin"><div class="sur">${ico("ok")}Reprise prouvée · décisions signées ${esc(E.par)}</div>
      <h2>bs-logistique tourne sur la copie reconstruite depuis le code</h2>
      <p>Coupure de ${fr(E.bascule.coupure, 1)} s, de l'arrêt de l'original au test métier vert, sans geste manuel. L'original est éteint, pas détruit : retour arrière possible.</p>
      <div class="actions"><div class="gros"><div class="v">${mmss(E.t_fin - E.t0)}</div><div class="l">de l'audit à la production</div></div>
        <button class="bouton" data-vers="rapport" data-principal>Rapport de reprise</button></div></div>`;
    return "";
  }
  return `<div class="prochaine"><div class="sur">Prochaine étape</div><h2>${esc(e.grand)}</h2><p>${esc(e.texte)}</p>
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}
    <div class="actions">${bouton({ ...e.action, grand: true })}</div></div>`;
}

function vueEnsemble() {
  const etapes = plan();
  const courante = etapes.find((x) => x.etat !== "ok");
  const a = E.audit, s = E.ci2?.rapport?.sauvegarde;
  const file = etapes.map((x, i) => `<button class="e ${x === courante ? "courante" : ""} ${x.etat === "ok" ? "fait" : ""}" ${x.vers && x.etat !== "avenir" ? `data-vers="${x.vers}"` : ""}>
      <div class="rang">${ico(x.etat)}<span class="num">Étape ${i + 1}</span></div><div class="t">${esc(x.titre)}</div><div class="c">${esc(x.court)}</div></button>`).join("");
  // Les quatre chiffres de la reprise, visibles dès l'accueil : ils se remplissent au fil de la démo.
  const n = nbCartes(), prises = !!E.decisions?.prises;
  const chiffres = `<div class="chiffres">
      <div class="chiffre"><div class="l">Écarts relevés</div><div class="v">${a ? a.total : "–"}</div><div class="s">${a ? `en ${duree(a.duree)}, en lecture seule` : "après l'audit"}</div></div>
      <div class="chiffre"><div class="l">Décisions humaines</div><div class="v" style="color:${prises ? "var(--vert)" : n ? "var(--ambre)" : "inherit"}">${n || (a ? a.comptes.inconnu || 0 : "–")}</div><div class="s">${prises ? `toutes signées ${esc(E.par)}` : n ? detailAttente() : a ? "inconnus à trancher" : "ce que personne n'a documenté"}</div></div>
      <div class="chiffre"><div class="l">Perte de données max</div><div class="v">${s ? fr(s.age_h, 1) + " h" : "–"}</div><div class="s">${s ? "âge de la dernière sauvegarde" : "connue après la preuve"}</div></div>
      <div class="chiffre"><div class="l">Coupure mesurée</div><div class="v" style="${E.bascule?.coupure ? "color:var(--vert)" : ""}">${E.bascule?.coupure ? fr(E.bascule.coupure, 1) + " s" : "–"}</div><div class="s">${E.bascule?.coupure ? "arrêt → test métier vert" : "après la bascule"}</div></div>
    </div>`;
