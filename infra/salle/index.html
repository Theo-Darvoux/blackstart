function erreurLocale(texte) { Object.assign(E, { erreur: texte, erreur_titre: null, erreur_vers: null, erreur_details: null, erreur_cles: null }); signature = ""; rendre(); }

// Même contrôle que le serveur (controler_decisions) : ce qui se contredit ou ne peut pas s'appliquer,
// par carte, pour le dire sous la carte concernée avant même d'envoyer.
const LIB_CHOIX = { reproduire: "Garder", "ne pas reproduire": "Retirer", accepter: "Accepter la perte" };
function libelleCle(cle) {
  const [genre, ...r] = cle.split(":"), reste = r.join(":");
  if (genre === "listen") return `le port ${reste.split(":").pop()}/${r[0]}`;
  if (genre === "process") { const [exe, user, unit] = reste.split("@"); return `le processus ${exe} (${user}${unit === "session.scope" ? ", lancé à la main" : ""})`; }
  if (genre === "sysctl") return `le réglage noyau ${reste}`;
  return reste || cle;
}
function conflitsDecisions(cartes) {
  const c = {};
  const ajoute = (k, m) => { (c[k] ||= []).push(m); };
  for (const x of cartes) {
    const d = choix[x.cle]?.decision;
    if (!d) continue;
    if (d === "reproduire" && x.garder_impossible) ajoute(x.cle, `« Garder » n'est pas applicable : ${x.garder_impossible}`);
    for (const l of x.liees || []) {
      const dl = choix[l]?.decision;
      if (dl && dl !== d) ajoute(x.cle, `Contredit le choix « ${LIB_CHOIX[dl]} » sur ${libelleCle(l)} : ils vont ensemble, choisir la même décision.`);
    }
  }
  return c;
}

function rendre() {
  if (!E) return;
  if (!vueDe(vue)) vue = "tableau";
  rendreNav(); rendreHaut(); rendreActivite();
  const sig = signatureVue() + (E.erreur || "");
  if (sig !== signature) {
    $("#vue").innerHTML = bandeauErreur() + vueDe(vue)[1]();
    signature = sig;
  }
}

function chargerParc(force) {
  return fetch("/parc" + (force ? "?force=1" : "")).then((r) => r.json()).then((d) => {
    if (d.erreur) parcErreur = d.erreur; else { P = d; P._v = Date.now(); parcErreur = d.rapport_erreur || null; }
  }).catch((e) => { parcErreur = String(e); }).then(() => { signature = ""; rendre(); });
}

function aller(v) {
  if (v !== vue) { edition = null; editionMachine = null; }
  vue = v; signature = "";
  if (v === "parc") chargerJoignabilite();
  if (v === "journal") chargerJournal();
  if (!CAPTURE) history.replaceState(null, "", "#" + v);
  rendre(); document.querySelector("main").scrollTop = 0;
  // Fondu à l'arrivée sur une vue (navigation seulement, pas à chaque mise à jour d'état).
  const el = $("#vue"); el.classList.remove("entree"); void el.offsetWidth; el.classList.add("entree");
}

function tic() {
  if (E) {
    const c = $("#chrono"); if (c && E.t0) c.textContent = mmss((E.t_fin || maintenant()) - E.t0);
    document.querySelectorAll("[data-depuis]").forEach((el) => {
      const s = maintenant() - Number(el.dataset.depuis);
      el.textContent = el.dataset.dixiemes ? `${fr(Math.max(0, s), 1)} s` : duree(Math.max(0, Math.floor(s)));
    });
  }
  if (!CAPTURE) requestAnimationFrame(tic);
}

function poster(action, corps) {
  return fetch(`/action/${action}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps || {}) })
    .then((r) => r.ok ? null : r.json().then((j) => { erreurLocale(j.erreur); }));
}

// ---------------------------------------------------------------- interactions
document.addEventListener("click", (ev) => {
  const a = ev.target.closest("[data-action]"), v = ev.target.closest("[data-vers]"), c = ev.target.closest("[data-choix]");
  const f = ev.target.closest("[data-filtre]"), el = ev.target.closest("[data-el]"), o = ev.target.closest("[data-op]");
  if (ev.target.closest("[data-parc]")) { chargerParc(true); return; }
  if (ev.target.closest("[data-joignabilite]")) { chargerJoignabilite(); return; }
  if (ev.target.closest("[data-activite]")) {
    activiteOuverte = !activiteOuverte;
    try { localStorage.setItem("bs-activite", activiteOuverte ? "1" : "0"); } catch (e) { /* stockage indisponible */ }
    rendre(); return;
  }
  if (ev.target.closest("[data-recharger-journal]")) { chargerJournal(); return; }
  const fj = ev.target.closest("[data-filtre-journal]");
  if (fj) { filtreJournal = fj.dataset.filtreJournal; rendre(); return; }
  if (ev.target.closest("[data-imprimer]")) { $("#cadre-rapport")?.contentWindow.print(); return; }
  const rp = ev.target.closest("[data-rapport]");
  if (rp) { rapportChoix = rp.dataset.rapport; signature = ""; rendre(); return; }
  const rv = ev.target.closest("[data-rapport-vers]");
  if (rv) { rapportChoix = rv.dataset.rapportVers; aller("rapport"); return; }
  const ed = ev.target.closest("[data-editer]");
  if (ed) { if (!ed.disabled) { edition = ed.dataset.editer || null; signature = ""; rendre(); } return; }
  const em = ev.target.closest("[data-modifier-machine]");
  if (em) { editionMachine = em.dataset.modifierMachine || null; signature = ""; rendre(); document.querySelector("#form-machine input")?.focus(); return; }
  const cp = ev.target.closest("[data-copier]");
  if (cp) {
    copier(cp.parentElement.querySelector("pre").textContent).then(() => { cp.textContent = "Copié"; setTimeout(() => { cp.textContent = "Copier"; }, 1500); },
      () => { cp.textContent = "Copie impossible"; });
    return;
  }
  const rt = ev.target.closest("[data-retirer]");
  if (rt) {
    const vm = rt.dataset.retirer;
    if (!confirm(`Retirer ${vm} du parc ? Son accès vérifié et son audit sont effacés de la plateforme. Le compte bs-collect reste sur le serveur tant qu'il n'est pas révoqué.`)) return;
    fetch("/parc/retirer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ vm }) })
      .then((r) => r.json().then((j) => { if (!r.ok) { erreurLocale(j.erreur); } else { chargerJournal(); chargerParc().then(() => aller("tableau")); } }));
    return;
  }
  if (ev.target.closest("[data-export]")) { exporterCSV(); return; }
  const lb = ev.target.closest("[data-labo]");
  if (lb) {
    if (lb.disabled) return;
    const q = lb.dataset.labo;
    if (q === "reinitialiser" && !confirm("Réinitialiser les données de la console ? Audits, accès vérifiés, journal et Activité repartent à zéro (archivés dans inventaires/archives/), la merge request ouverte est fermée et l'historique de la forge est masqué. Les machines repassent « Pas encore reconstruite »."))
      return;
    fetch(`/action/labo/${q}`, { method: "POST" })
      .then((r) => r.json().then((j) => { if (!r.ok || j.erreur) erreurLocale(j.erreur); chargerJournal(); chargerParc(true); }));
    return;
  }
  if (a) {
    if (a.disabled) return;
    const nom = a.dataset.action;
    opChoisie = null;
    if (nom === "decider") { poster("decider", { choix }); aller("ci"); }
    else if (a.dataset.vm) poster(nom, { vm: a.dataset.vm });
    else { poster(nom); if (a.dataset.vers) aller(a.dataset.vers); }
  } else if (v) aller(v.dataset.vers);
  else if (f) { filtre = f.dataset.filtre; signature = ""; rendre(); }
  else if (el) { const k = el.dataset.el; ouverts.has(k) ? ouverts.delete(k) : ouverts.add(k); $("#lignes").innerHTML = lignesInventaire(); }
  else if (o) { opChoisie = o.dataset.op === (opEnCours() || ops()[ops().length - 1])?.id ? null : o.dataset.op; rendreActivite(); }
  else if (c) {
    const cle = c.closest("[data-cle]").dataset.cle, cartes = E.decisions.cartes;
    // Raison préparée pour ce choix ; elle remplace une raison préparée pour l'autre choix,
    // jamais un texte tapé à la main. Les éléments liés (port et processus qui l'ouvre) reçoivent
    // la même décision : impossible de se contredire.
    const appliquer = (k) => {
      const raisons = (cartes.find((x) => x.cle === k) || {}).raisons || {};
      const tape = (choix[k]?.raison || "").trim();
      const prepare = !tape || Object.values(raisons).some((r) => r.trim() === tape);
      choix[k] = { decision: c.dataset.choix, raison: prepare ? (raisons[c.dataset.choix] || "") : tape };
    };
    [cle, ...((cartes.find((x) => x.cle === cle) || {}).liees || [])].forEach(appliquer);
    if (E.erreur_cles) E.erreur_cles = E.erreur_cles.filter((k) => k !== cle && !((cartes.find((x) => x.cle === cle) || {}).liees || []).includes(k));
    signature = ""; rendre();
    const neuf = document.querySelector(`[data-cle="${CSS.escape(cle)}"] textarea`);
    if (neuf && !choix[cle].raison) neuf.focus();
  }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "recherche") { recherche = ev.target.value; $("#lignes").innerHTML = lignesInventaire(); return; }
  if (ev.target.matches("[data-compte]")) {
    compteAdmin = ev.target.value.trim() || "admin";
    try { localStorage.setItem("bs-compte-admin", compteAdmin); } catch (e) { /* stockage indisponible */ }
    document.querySelectorAll("[data-var-compte]").forEach((x) => { x.textContent = compteAdmin; });
    return;
  }
  if (!ev.target.matches("[data-raison]")) return;
  const cle = ev.target.closest("[data-cle]").dataset.cle;
  choix[cle] = { ...(choix[cle] || {}), raison: ev.target.value };
  const cartes = E.decisions?.cartes || [];
  const faites = cartes.filter((x) => choix[x.cle]?.decision && choix[x.cle]?.raison?.trim()).length;
  const nbConflits = Object.keys(conflitsDecisions(cartes)).length;
  const b = $("#valider"); if (b) { b.disabled = faites !== cartes.length || nbConflits > 0 || E.occupe; b.classList.toggle("pret", !b.disabled); b.textContent = nbConflits ? `${nbConflits} choix à corriger` : `Valider ${faites} / ${cartes.length} et relancer la preuve`; }
  const g = $("#jauge"); if (g) g.style.width = `${faites / (cartes.length || 1) * 100}%`;
  majOngletDecisions();
  ev.target.closest(".dec").classList.toggle("prise", !!(choix[cle].decision && choix[cle].raison.trim()));
});
// Presse-papiers : l'API n'existe qu'en contexte sûr (localhost, https) ; sur http://blackstart.local on passe par une zone de texte.
function copier(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, ko) => {
    const z = document.createElement("textarea"); z.value = t; z.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(z); z.select();
    try { document.execCommand("copy") ? ok() : ko(); } catch (e) { ko(e); } finally { z.remove(); }
  });
}
const posterJSON = (url, corps) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps) })
  .then((r) => r.json().then((j) => { if (!r.ok) throw new Error(j.erreur || "erreur"); return j; }));
const lignesEnDict = (t) => Object.fromEntries(String(t || "").split("\n").map((l) => l.trim()).filter(Boolean).map((l) => { const [ip, ...r] = l.split(/\s+/); return [ip, r.join(" ")]; }));

// Paramètres : un bloc modifié à la fois ; machine : rôle, criticité, adresse.
document.addEventListener("submit", (ev) => {
  const f = ev.target;
  if (f.id !== "form-reglages" && f.id !== "form-machine") return;
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(f)), err = f.querySelector(".erreur-form"), b = f.querySelector("button[type=submit]");
  let corps;
  if (f.id === "form-machine") corps = { vm: f.dataset.vm, ...d };
  else {
    const sec = f.dataset.section;
    corps = { organisation: P.organisation, description: P.description };
    if (sec === "organisation") Object.assign(corps, { organisation: d.organisation, description: d.description });
    if (sec === "perimetre") Object.assign(corps, { reseaux: d.reseaux.split(/[\s,]+/).filter(Boolean), exclues: lignesEnDict(d.exclues) });
    if (sec === "reference") corps.reference = { fichier: d.fichier, nom: d.nom };
    if (sec === "adresses") corps.adresses_connues = lignesEnDict(d.adresses_connues);
  }
  b.disabled = true; err.textContent = "";
  posterJSON(f.id === "form-machine" ? "/parc/modifier" : "/parc/reglages", corps)
    .then(() => { edition = null; editionMachine = null; chargerJournal(); return chargerParc(); })
    .catch((e) => { err.textContent = e.message; b.disabled = false; });
});

// Ajout d'une machine : déclarée dans le registre, puis on ouvre sa fiche (étape « installer l'accès »).
document.addEventListener("submit", (ev) => {
  if (ev.target.id !== "form-ajout") return;
  ev.preventDefault();
  const corps = Object.fromEntries(new FormData(ev.target)), err = $("#erreur-ajout"), b = ev.target.querySelector("button[type=submit]");
  b.disabled = true; err.textContent = "";
  fetch("/parc/ajouter", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps) })
    .then((r) => r.json().then((j) => {
      if (!r.ok) { err.textContent = j.erreur || "erreur"; b.disabled = false; return; }
      chargerJournal(); return chargerParc().then(() => aller("m-" + j.vm));
    })).catch((e) => { err.textContent = String(e); b.disabled = false; });
});
// Raccourci discret pour le présentateur : → déclenche l'action principale de la vue affichée.
document.addEventListener("keydown", (ev) => {
  if (ev.target.matches("textarea, input")) return;
  if (ev.key === "ArrowRight") {
    const b = document.querySelector("#vue [data-principal]:not(:disabled)");
    if (b) { ev.preventDefault(); b.click(); }
  }
});

// Rapport : l'iframe prend la hauteur réelle du document (message envoyé par rapport.html).
window.addEventListener("message", (ev) => {
  if (ev.origin === location.origin && ev.data?.rapportHauteur) { const c = $("#cadre-rapport"); if (c) c.style.height = ev.data.rapportHauteur + 4 + "px"; }
});
// Infrastructure : état réel des machines, relu toutes les 20 s tant que la vue est ouverte.
function chargerJoignabilite() {
  return fetch("/joignabilite").then((r) => r.json()).then((d) => { J = d; if (vue === "parc") rendre(); }).catch(() => {});
}
setInterval(() => { if (vue === "parc" && !CAPTURE) chargerJoignabilite(); }, 20000);

// Lien direct ou retour arrière du navigateur : la vue suit l'adresse.
window.addEventListener("hashchange", () => { const v = location.hash.replace(/^#/, ""); if (!CAPTURE && v && v !== vue && vueDe(v)) aller(v); });

function brancher() {
  let versionPage = null;
  const src = new EventSource("/flux");
  src.onmessage = (m) => {
    const neuf = JSON.parse(m.data);
    // index.html a changé depuis le chargement : recharger, plutôt que de garder des règles périmées.
    if (versionPage == null) versionPage = neuf.page; else if (neuf.page && neuf.page !== versionPage) { location.reload(); return; }
    decalage = neuf.maintenant - Date.now() / 1000;
    if (neuf.phase === "accueil" && E && E.phase !== "accueil") { for (const k in choix) delete choix[k]; ouverts.clear(); }
    const finie = E && E.phase !== "fini" && neuf.phase === "fini";
    // Vérification d'accès ou premier audit terminé : le registre a changé, on le relit.
    const integ = (x) => (x?.operations || []).filter((o) => o.vm && o.etat !== "en_cours").map((o) => o.id).join();
    const integFinie = E && integ(E) !== integ(neuf);
    const finies = (x) => (x?.operations || []).filter((o) => o.etat !== "en_cours").length;
    const opFinie = E && finies(E) !== finies(neuf);
    E = neuf;
    // Une opération démarre : le panneau Activité s'ouvre pour la suivre pas à pas.
    const cour = opsVisibles().find((o) => o.etat === "en_cours");
    if (cour && cour.id !== dernierOpVu) { dernierOpVu = cour.id; activiteOuverte = true; }
    rendre();
    if (integFinie) chargerParc();
    if (opFinie) chargerJournal();
    if (finie) chargerParc(true);   // la reprise vient d'aboutir : preuve et bascule relues, rapport régénéré
  };
  src.onerror = () => { if (E) { erreurLocale("Connexion au serveur de la console perdue : nouvelle tentative…"); } };
}
// #capture[-vue] : état lu une fois, sans flux (captures d'écran sans navigateur affiché).
if (CAPTURE) fetch("/etat").then((r) => r.json()).then((d) => { decalage = d.maintenant - Date.now() / 1000; E = d; return chargerParc(); }).then(() => vue === "parc" ? chargerJoignabilite() : vue === "journal" ? chargerJournal() : null).then(() => { signature = ""; rendre(); tic(); });
else { brancher(); requestAnimationFrame(tic); chargerParc(); chargerJournal(); if (vue === "parc") chargerJoignabilite(); setInterval(() => chargerParc(), 5 * 60 * 1000); }
</script>
</body>
